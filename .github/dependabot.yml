# Dependabot — automated dependency update pull requests.
#
# This is the file half of the brief's "enable secret scanning and Dependabot" requirement.
# The alerting half is a repository setting on github.com and must be switched on there:
#   Settings -> Code security -> Dependabot alerts, and Secret scanning.
#
# Grouped updates keep the PR volume low; this is a two-person project and a flood of
# single-dependency PRs would be noise rather than safety.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # React refuses to start unless `react` and `react-dom` are exactly the same version (its
      # error #527), and Dependabot has twice moved `react-dom` alone: FINDINGS #92, on 26 September
      # and 19 October 2026. One group, so the four always arrive in one pull request, majors too.
      # It is listed first because a dependency joins the first group it matches, and the two
      # `@types` packages also match dev-tooling's `@types/*`. `pnpm deps:check` still refuses a
      # split, should one arrive another way.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      dev-tooling:
        patterns:
          - '@types/*'
          - 'typescript'
          - 'typescript-eslint'
          - 'eslint*'
          - 'prettier'
          - 'vitest'
          - '@vitest/*'
          - 'turbo'
          - 'dependency-cruiser'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
