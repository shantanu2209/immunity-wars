# The per-push tier.
#
# Budget: under 5 minutes wall clock. Achieved by running jobs in PARALLEL, so the tier costs the
# longest job rather than the sum.
#
# MEASURED on ubuntu-latest, 19 Aug 2026 (cold cache / warm cache):
#
#   plan          24s / 25s
#   static      1m 00s / 54s
#   test        4m 00s / 3m 00s
#   test-balance  59s / 56s
#   coverage    5m 00s / 4m 00s   <- the critical path; very nearly the whole tier
#   ci-green      16s / 23s
#   tier        ~5m16s / ~4m23s
#
# The cold/warm split is the pnpm store cache. Steady state is the warm column. GitHub reports job
# duration and excludes queue time, so real push-to-green is longer than this.
#
# TRIGGER: coverage moves to nightly if it sits above 5 minutes on WARM-cache runs, and if it moves
# the fact goes on the dashboard rather than into a comment nobody reads. See .github/README.md.
#
# WHAT THE JOB LIST IS NOT: hand-written. `tools/ci/matrix.ts` derives it from tests/suites.json,
# so a suite that gains a tier cannot silently fail to get a job.
#
# NOTHING HERE NEEDS A SECRET. If a step ever appears to, that is a design change to discuss, not
# a value to add — this is a public repository and its logs are public.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege, set at the top so every job inherits read-only and must opt out explicitly.
# No job in this workflow writes anything back to the repository.
permissions:
  contents: read

# Supersede in-flight runs on a branch, but never on main: a cancelled run on main would leave
# the aggregate gate with no verdict, and "no verdict" must never look like a pass.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned so "works locally, fails in CI" does not become a recurring tax (PHASE1_BRIEF §5).
  NODE_VERSION: '22'

jobs:
  # Derives the job matrix from the manifest. Everything downstream reads it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: matrix
        run: echo "matrix=$(node --import tsx tools/ci/matrix.ts per-push)" >> "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm boundaries

  suites:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # One red suite must not cancel the others: the point of a run is to learn everything that
      # broke, not the first thing.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The command comes from the manifest via an env var, never interpolated into the shell.
      # `${{ }}` inside a run: block is substituted before bash sees it, so a crafted branch name
      # or manifest string would be executed. Through env it is data.
      - name: Run ${{ matrix.id }}
        env:
          SUITE_COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          echo "::group::$SUITE_COMMAND"
          eval "$SUITE_COMMAND"
          echo "::endgroup::"

      # Written by a script, not by printf. The grouped matrix carries no `scale`, so the
      # old `${{ matrix.scale }}` was empty in every result file the first nightly wrote;
      # and hand-built JSON would break on any quote in the manifest prose. The scale now
      # comes from the manifest, so the page and suites.json cannot disagree.
      - name: Record results
        if: always()
        env:
          SUITE_IDS: ${{ join(matrix.suiteIds, ' ') }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          STATUS="$([ "$JOB_STATUS" = "success" ] && echo pass || echo fail)"
          node --import tsx tools/ci/record-result.ts "$STATUS" per-push $SUITE_IDS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: results-${{ matrix.id }}
          path: results/
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Clean first. Every tier writes to the same directory, and a merged report is the wrong
      # tier's numbers — the footgun recorded in tests/equivalence/coverage-gate.ts.
      - run: rm -rf coverage && pnpm coverage:all
      - run: pnpm coverage:gate

      # The gate REGENERATES docs/COVERAGE_EXCLUSIONS.md and COVERAGE_DEFERRED.md. Comparing them
      # against what is committed turns a side effect into a check: the exclusion list is a
      # liability and it must not be able to drift silently.
      - name: The regenerated exclusion list must match what is committed
        run: |
          set -euo pipefail
          if ! git diff --exit-code docs/COVERAGE_EXCLUSIONS.md docs/COVERAGE_DEFERRED.md; then
            echo "::error::The coverage gate regenerated a different exclusion list than the one committed."
            echo "Run 'pnpm coverage:all && pnpm coverage:gate' and commit the result."
            exit 1
          fi

  # The one required status check. Branch protection keys on this and nothing else.
  ci-green:
    needs: [plan, static, suites, coverage]
    # `always()` so this runs even when a dependency failed or was skipped. Without it the gate
    # would itself be skipped, and a skipped required check is what turns the merge button green
    # having verified nothing.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # THE DECISION LIVES IN A SCRIPT, NOT IN THIS FILE.
      #
      # Logic that lives in YAML cannot be falsified; logic in a script can. The obvious
      # expression — !contains(needs.*.result, 'failure') — is GREEN when a needed job was
      # SKIPPED, and jobs skip for ordinary reasons. tools/ci/aggregate.test.ts hands the gate a
      # skipped job and requires exit 1; no workflow expression could be tested that way without
      # deliberately breaking a build on main.
      - name: Aggregate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node --import tsx tools/ci/aggregate-run.ts "$NEEDS" plan static suites coverage
