# The nightly tier, and the only workflow that publishes.
#
# Everything the per-push tier is too slow to run: the full corpus (2,000 games, ~13 min), the
# property suite at 10,002 games (~14 min), the state-size measurement, and coverage for the trend.
# The two long legs run in parallel, so the tier costs ~15 minutes rather than ~30.
#
# WHAT IT DELIBERATELY DOES NOT RUN: `metrics-run.ts`. That recalibrates the balance bands and
# OVERWRITES bands.json — a scheduled recalibration would regenerate the panel's own reference and
# it could never fail again. It is `manual` in the manifest and a human runs it. The matrix
# generator's tests assert it appears in no automated tier.

name: Nightly

on:
  schedule:
    # 02:00 UTC. GitHub queues scheduled runs, so treat the time as approximate.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a nightly: a partial run publishes a partial page.
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: matrix
        run: echo "matrix=$(node --import tsx tools/ci/matrix.ts nightly)" >> "$GITHUB_OUTPUT"

  suites:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.id }}
        env:
          SUITE_COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          eval "$SUITE_COMMAND"
      - name: Record results
        if: always()
        env:
          SUITE_IDS: ${{ join(matrix.suiteIds, ' ') }}
          SUITE_SCALE: ${{ matrix.scale }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p results
          for id in $SUITE_IDS; do
            printf '{"id":"%s","status":"%s","detail":"%s","ranAt":"%s"}\n' \
              "$id" \
              "$([ "$JOB_STATUS" = "success" ] && echo pass || echo fail)" \
              "$SUITE_SCALE" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "results/$id.json"
          done
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: nightly-results-${{ matrix.id }}
          path: results/
          retention-days: 14

  # The measurements the dashboard plots over time.
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rm -rf coverage && pnpm coverage:all && pnpm coverage:gate | tee coverage-gate.txt
      - run: npx tsx tests/balance/size-run.ts 200 60 | tee size-run.txt
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: nightly-measurements
          path: |
            coverage-gate.txt
            size-run.txt
          retention-days: 14

  # Appends one history record. The ONLY job in either workflow with write access, and it writes
  # to an orphan branch that holds nothing but data — never to main.
  record:
    needs: [suites, measure]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
      - name: Append a history record to the results-data branch
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Committed by the bot, with GitHub's no-reply address. Commit metadata is permanent and
          # routinely scraped; no contributor address appears here (PHASE1_BRIEF §5).
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin results-data --depth=1 2>/dev/null || true
          git checkout results-data 2>/dev/null || git checkout --orphan results-data
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p history

          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          COVERAGE_PCT="$(grep -oE 'COVERABLE branch coverage +[0-9.]+' artifacts/nightly-measurements/coverage-gate.txt 2>/dev/null | grep -oE '[0-9.]+$' || echo '')"
          {
            printf '{"at":"%s","commit":"%s"' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$COMMIT_SHA"
            [ -n "$COVERAGE_PCT" ] && printf ',"coveragePct":%s' "$COVERAGE_PCT"
            printf '}\n'
          } > "history/$STAMP.json"

          git add history
          git commit -m "nightly $STAMP" || echo 'nothing new to record'
          git push origin results-data

  publish:
    needs: [suites, measure, record]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts

      - name: Collect suite results
        run: |
          set -euo pipefail
          mkdir -p results
          # A result file that never arrived leaves NO file, and build.ts renders that row RED.
          find artifacts -name '*.json' -path '*results*' -exec cp {} results/ \; 2>/dev/null || true
          ls -la results/ || echo 'no results at all — every row will render red'

      - name: Fetch the accumulated history
        run: |
          set -euo pipefail
          mkdir -p history
          git fetch origin results-data --depth=1 2>/dev/null \
            && git --work-tree=history checkout origin/results-data -- history 2>/dev/null \
            && mv history/history/* history/ 2>/dev/null || true
          echo "history records: $(ls history/*.json 2>/dev/null | wc -l)"

      # The site is built from an EXPLICIT output directory, never from docs/ wholesale. docs/
      # contains the rulebook and study packet, which are gitignored and unlicensed — publishing
      # the folder would be one careless change away from publishing Kartik's design work.
      - name: Build the dashboard
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node --import tsx tools/dashboard/build.ts results history site

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
