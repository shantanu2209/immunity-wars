    <link rel="icon" href="data:," />
    <!--
      THE MEASURING PAGE (stage L4, docs/LOOK_PLAN.md §14): the play screen as a player has it,
      with a Measure button that plays a few turns and counts the frames the phone gives the page.
      A developer's page, like dev.html and kit.html: no player is sent here, and the build keeps
      it out of what a phone stores for offline play. A build-check test fails if this entry stops
      building.
    -->
    <style>
      /* The whole range of weights: the kit sets headings at 900, which the app's own
         declaration (400 to 700) would have drawn as a faked bold. */
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 200 1000;
        font-display: swap;
        src: url('/fonts/nunito-latin-var.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        background: #0e2a30;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/measure.tsx"></script>
  </body>
</html>
