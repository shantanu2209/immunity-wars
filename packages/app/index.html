<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      THE APP'S ICON (ruled 3 October 2026), the Android app's, written by `pnpm art:icon` into
      public/icons/. NAMED HERE, so the browser does not go looking for /favicon.ico, which does not
      exist: asked for with no network, that is a request that fails, and from stage L4 the browser
      asks again in the middle of play (measured: at the first press that makes a sound), so the
      Gate 1 audit's offline pass counted a failed request in a build that plays offline. Until this
      day it was `data:,`, an icon of nothing. Both files are stored by the worker, so they are
      answered with no network too (src/entries-build.test.ts). The apple-touch-icon is what an
      iPhone puts on its home screen; without it, a picture of the page.
    -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /* THE TABLE (stage L5): the page's own ground is the kit's table, from the first paint, so a
         screen that is loading is dark and not a white flash. The colour is the kit's
         (packages/ui/src/kit/tokens.ts, COLOUR.table); src/ground.test.ts holds the two together. */
      html,
      body {
        background: #0e2a30;
      }
    </style>
    <title>The Immunity Wars</title>
    <!--
      THE APP (docs/APP_FLOW.md): Title -> Difficulty -> Play -> Result. The instrumented
      dev shell lives at /dev.html and must keep building (ruling 6).
    -->
    <style>
      /* Nunito (variable, latin, OFL — public/fonts/OFL.txt): the board's typography,
         decided at P2.5 piece 2 and bundled so it works fully offline (Gate 1). */
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/nunito-latin-var.woff2') format('woff2');
      }
      /* Noto Sans Devanagari (variable, OFL: public/fonts/OFL-NotoSansDevanagari.txt), bundled
         for the Hindi edition by ruling of 25 November 2026 (docs/LOOK_PLAN.md §34), so Hindi is
         drawn in one face on every phone and with no network. Nunito has no Devanagari; the kit's
         family names this face second, and the range below keeps it to that script, so it is
         fetched only where Devanagari is drawn: in English, that is the Language row's own word
         for Hindi. Its weights are declared as Nunito's are, so a bold word is as bold in either
         script. */
      @font-face {
        font-family: 'Noto Sans Devanagari';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/noto-sans-devanagari-var.woff2') format('woff2');
        unicode-range:
          U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839,
          U+A8E0-A8FF, U+11B00-11B09;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
