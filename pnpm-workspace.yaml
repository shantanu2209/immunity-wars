# Workspace members.
#
# tools/legacy/ is deliberately NOT a workspace member. It has its own package.json
# (the old LAN server, with its own ws/qrcode/jsdom dependencies) but it is read-only
# reference material, not part of the build. Including it would install and typecheck
# code we have committed never to edit.

packages:
  - 'packages/*'
  # Test suites that cannot live inside a package. The equivalence rig loads the legacy
  # CommonJS engine off disk and swaps the global Math.random, so it needs Node APIs —
  # which packages/engine forbids by design (tsconfig "types": [], plus the
  # engine-no-node-builtins dependency-cruiser rule). Keeping it here preserves that
  # purity guarantee instead of poking a hole in it for the sake of a test.
  - 'tests/*'
  # CI helpers and the results dashboard. Workspace members so that typecheck, lint and test reach
  # them: the dashboard is the instrument that REPORTS on every other instrument, and the aggregate
  # gate decides whether the build is green. Neither can be the one thing nobody checks.
  # tools/legacy stays excluded for the reason above; tools/balance-sim is empty and is not listed.
  - 'tools/ci'
  - 'tools/dashboard'
  - 'tools/legacy-harness'
  # P2.4's art pipeline: keys/trims/gates the generated raw art and emits WebP + manifest.
  # A workspace member because its contrast gate is the check the whole token set depends on.
  - 'tools/art-pipeline'
  # P2.3's measurement driver: launches system Chrome over CDP, applies CPU throttling, drives
  # the dev shell and collects the page's own __iwMetrics. A workspace member so typecheck and
  # lint reach it — an instrument nobody typechecks is the known failure shape.
  - 'tools/perf'
  # Stage L2 of the look (docs/LOOK_PLAN.md): the Clay play screen drawn three ways, with the
  # frame timer that measures them on the S25. A workspace member for the same reason as
  # tools/perf, and the only home of pixi.js and three (ruled 1 October 2026). Nothing in
  # packages/ may import it; it is removed when L2's ruling has been built into the app.
  - 'tools/look-prototype'

# pnpm blocks dependency install scripts unless they are allow-listed, because a
# postinstall script is arbitrary code execution at install time. esbuild is allowed
# because Vitest depends on it and its postinstall step links the platform binary;
# without it, the test runner cannot start.
#
# Anything added here should be a build-tool binary with an understood reason.
allowBuilds:
  esbuild: true
  # sharp ships its platform binary as an optional dependency (@img/sharp-win32-x64); its
  # install script is only a fallback download for platforms without a prebuild. Blocked:
  # if sharp ever fails to load on a new machine, the fix is installing the right @img
  # optional package, not opening arbitrary code execution at install time.
  sharp: false

# nanoid: GHSA-2v37-7h3g-55p8 (high, dev-only chain: vite > postcss > nanoid). The patched
# 3.3.18 is inside postcss's ^3 range, but pnpm keeps the lockfile's pre-existing 3.3.16 on
# re-resolution, so the range alone never picks up the fix. Pinned at the P2.2 vitest-4
# upgrade; drop the override when the lockfile naturally resolves past it.
overrides:
  'nanoid@<3.3.18': '>=3.3.18'
  # fast-uri: GHSA-jqff-g426-hqxp, -f65p-4m7j-42xc, -fph4-wmhf-6fwf, -5jgf-p345-68v8 (four high,
  # dev-only: dependency-cruiser > ajv > fast-uri, validating our own config). Not reachable
  # (docs/SECURITY_NOTES.md, 4 Sep 2026); taken anyway by ruling because it is one line with no
  # behaviour change and clears four alerts. Drop when the lockfile resolves past it.
  # Raised 30 Sep 2026 for GHSA-hrr3-gc8f-f4qj (moderate), by then reached through
  # vite-plugin-pwa > workbox-build > ajv at build time only. Still inside ajv's 3.x range.
  'fast-uri@<3.1.8': '^3.1.8'
  # brace-expansion: GHSA-6j4f-fj2g-mc7p, -qhr7-859c-m2p7 (high), -q2hr-2g5m-vwhr (moderate), all
  # denial of service on crafted brace patterns. Dev-only: vite-plugin-pwa > workbox-build > ... >
  # minimatch 5 > brace-expansion 2, globbing our own build output at build time. The 5.x line was
  # already past its fix (5.0.12, Dependabot); 2.x is pinned inside minimatch 5's ^2 range, since
  # pnpm keeps the locked 2.1.4 otherwise. Taken on the 4 Sep ruling's terms (one line, no
  # behaviour change). docs/SECURITY_NOTES.md, 30 Sep 2026. Drop when the lock resolves past it.
  'brace-expansion@>=2.0.0 <2.1.7': '^2.1.7'

minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@4.1.11'
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
  - vitest@4.1.11
