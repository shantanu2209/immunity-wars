# Workspace members.
#
# tools/legacy/ is deliberately NOT a workspace member. It has its own package.json
# (the old LAN server, with its own ws/qrcode/jsdom dependencies) but it is read-only
# reference material, not part of the build. Including it would install and typecheck
# code we have committed never to edit.

packages:
  - 'packages/*'
  # Test suites that cannot live inside a package. The equivalence rig loads the legacy
  # CommonJS engine off disk and swaps the global Math.random, so it needs Node APIs —
  # which packages/engine forbids by design (tsconfig "types": [], plus the
  # engine-no-node-builtins dependency-cruiser rule). Keeping it here preserves that
  # purity guarantee instead of poking a hole in it for the sake of a test.
  - 'tests/*'
  # CI helpers and the results dashboard. Workspace members so that typecheck, lint and test reach
  # them: the dashboard is the instrument that REPORTS on every other instrument, and the aggregate
  # gate decides whether the build is green. Neither can be the one thing nobody checks.
  # tools/legacy stays excluded for the reason above; tools/art-pipeline and tools/balance-sim are
  # empty and are not listed.
  - 'tools/ci'
  - 'tools/dashboard'
  - 'tools/legacy-harness'

# pnpm blocks dependency install scripts unless they are allow-listed, because a
# postinstall script is arbitrary code execution at install time. esbuild is allowed
# because Vitest depends on it and its postinstall step links the platform binary;
# without it, the test runner cannot start.
#
# Anything added here should be a build-tool binary with an understood reason.
allowBuilds:
  esbuild: true
