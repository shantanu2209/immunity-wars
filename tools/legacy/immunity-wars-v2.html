<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Immunity Wars — The Body v2</title>
<style>
:root{
  --panelSolid:#1a0e1d; --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.09);
  --ink:#f6eef2; --muted:#bda6b8; --faint:#8d7389; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --heart:#e6394b; --heartGlow:rgba(230,57,75,.6);
  --virus:#ef4444; --hidden:#b45cf0; --bacteria:#9bb02f; --antibody:#fbbf24;
  --good:#34d399; --bad:#fb5c6c; --labc:#38bdf8;
  --o-brain:#c084fc; --o-lungs:#7dd3fc; --o-heart:#fb7185; --o-liver:#fbbf24;
  --o-spleen:#f472b6; --o-kidneys:#2dd4bf; --o-marrow:#fb923c;
  --c-macrophage:#8b7cf6; --c-neutrophil:#38bdf8; --c-bcell:#f472b6; --c-tcell:#a3e635; --c-helper:#facc15; --c-nk:#f97316; --c-eosinophil:#fb7185;
  --toxin:#84cc16; --fungus:#a78bfa; --worm:#f59e0b; --malaria:#22d3ee; --parasite:#e879f9;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);
  background:radial-gradient(1300px 800px at 10% -12%,#3d1d43,transparent 56%),radial-gradient(1100px 900px at 102% 118%,#3c1430,transparent 52%),linear-gradient(165deg,#150a17,#22111f 58%,#180d1a);
  min-height:100vh}
#app{max-width:1400px;margin:0 auto;padding:14px 14px 44px}
button{cursor:pointer;color:inherit;border:none;background:none;font-family:inherit}
h1,h2{margin:0;font-weight:800;letter-spacing:-.02em}
.mono{font-family:var(--mono)}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 13px;border-radius:10px;font-weight:700;font-size:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.05));border:1px solid var(--line2);color:var(--ink);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 2px 8px -4px rgba(0,0,0,.6);transition:.13s}
.bt:hover{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.07));transform:translateY(-1px)}
.bt:active{transform:translateY(0)}
.bt.pri{background:linear-gradient(180deg,#f0475a,#c2263a);border-color:#e6394b;color:#fff;box-shadow:0 6px 20px -8px var(--heartGlow)}
.bt.lb{background:linear-gradient(180deg,#4cc4fa,#0e82bd);border-color:#38bdf8;color:#04222f}
.bt.sm{padding:6px 10px;font-size:11.5px;border-radius:8px}
.bt.gh{background:transparent;box-shadow:none}
.bt:disabled{opacity:.32;cursor:not-allowed;transform:none}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--line);
  border-radius:15px;backdrop-filter:blur(6px);box-shadow:0 18px 44px -28px rgba(0,0,0,.9)}
.lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-family:var(--mono);margin-bottom:7px}
.hnt{font-size:12px;color:var(--faint);line-height:1.5}
.tbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.ro{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;padding:7px 11px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.tb{flex:1;min-width:90px;height:8px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line);overflow:hidden}
.tb>div{height:100%;background:linear-gradient(90deg,#e6394b,#f472b6);transition:width .4s}
.pips{display:flex;gap:3px}
.apNum{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--muted);margin-right:7px;white-space:nowrap}
.apNum .apOf{color:var(--faint);font-weight:600}
.apNum.up{color:#6ee7a8}
.apNum.dn{color:#fbbf24}
.pip.bonus{border-color:#6ee7a8}
.pip.bonus.on{background:linear-gradient(180deg,#86efac,#16a34a);border-color:#6ee7a8;box-shadow:0 0 8px -2px #6ee7a8}
.tk.offline,.artIcon.offline{filter:grayscale(1);opacity:.42}
.pip{width:10px;height:18px;border-radius:3px;background:rgba(255,255,255,.12);border:1px solid var(--line2)}
.pip.on{background:linear-gradient(180deg,#fcd34d,#e08c12);border-color:#fbbf24;box-shadow:0 0 8px -2px #fbbf24}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--labc);border:1px solid var(--labc);border-radius:6px;padding:2px 7px}
.phb{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:13px;margin-bottom:11px;border:1px solid var(--line2);
  background:linear-gradient(90deg,rgba(230,57,75,.14),rgba(180,92,240,.07))}
.phb .dt{width:9px;height:9px;border-radius:50%;background:var(--heart);box-shadow:0 0 12px var(--heartGlow);animation:pl 1.6s infinite}
.phb .pt{font-weight:800;font-size:14px}.phb .ps{color:var(--muted);font-size:12px}.phb .gw{flex:1}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}

.wrap{display:grid;grid-template-columns:1fr;gap:12px;align-items:stretch}
@media(min-width:1060px){.wrap{grid-template-columns:minmax(520px,1.15fr) minmax(380px,440px)}}
.bodyWrap{position:relative;border-radius:16px;padding:10px;overflow:hidden;
  background:radial-gradient(circle at 53% 38%,rgba(230,57,75,.12),transparent 55%),linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.06));
  border:1px solid var(--line);box-shadow:inset 0 0 90px -30px rgba(230,57,75,.3)}
.body{position:relative;width:100%;padding-top:140.9%}
.bodyInner{position:absolute;inset:0;transform-origin:0 0;transition:transform .55s cubic-bezier(.4,0,.2,1)}
/* region-focus zoom system */
.regionHot{position:absolute;transform:translate(-50%,-50%);border:1.5px dashed rgba(255,255,255,.28);border-radius:16px;background:rgba(255,255,255,.03);z-index:70;cursor:pointer;display:flex;align-items:flex-start;justify-content:center;transition:.2s}
.regionHot:hover,.regionHot:active{background:rgba(139,124,246,.14);border-color:rgba(139,124,246,.6)}
.regionHot .rlab{margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#e9d5ff;background:rgba(20,12,26,.82);border-radius:8px;padding:3px 9px;white-space:nowrap}
.zoomBar{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;justify-content:space-between;align-items:center;padding:8px 10px;z-index:80;pointer-events:none}
.zoomBar>*{pointer-events:auto}
.zBtn{background:rgba(30,18,40,.9);border:1px solid #4a3860;color:#e9d5ff;border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
.zBtn:active{background:#3a2850}
.zTitle{background:rgba(30,18,40,.9);border:1px solid #4a3860;color:#f3e9fb;border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:800;letter-spacing:.04em;backdrop-filter:blur(6px)}
.overviewHint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(30,18,40,.85);color:#c9b6dc;border:1px solid #4a3860;border-radius:20px;padding:6px 14px;font-size:11.5px;z-index:80;pointer-events:none}
/* focused lane panel */
.bodyWrap.dimmed .bodyInner{filter:blur(3px) brightness(.4);transition:filter .3s}
.lanePanelOv{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;background:rgba(10,6,14,.55);backdrop-filter:blur(2px);animation:lpIn .28s ease}
@keyframes lpIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lpBar{display:flex;gap:8px;align-items:center;padding:10px 12px;flex:none}
.lpAP{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);border-radius:20px;padding:4px 11px}
.lpAP .apDot{width:8px;height:8px;border-radius:50%;background:#fbbf24;box-shadow:0 0 6px #fbbf24}
.lpAP.empty{color:#9c8ba8;background:rgba(255,255,255,.05);border-color:#3a2e46}
.lpAP.empty .apDot{background:#5c4e68;box-shadow:none}
/* THE LANE as a vessel: centered column; each step is [number][node][hint] that travels together.
   The vessel line is drawn by connector segments between nodes — so it never overshoots the ends. */
.lpLane{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:10px 0 20px;width:100%}
.lpEntry,.lpExit{text-align:center;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:8px 14px;margin-bottom:2px;border-radius:22px;background:rgba(20,12,26,.9);border:1.5px solid}
/* each step: a 3-column grid, centered as a unit. col widths fixed so nodes line up in a column. */
.lpStep{display:grid;grid-template-columns:120px 84px 120px;align-items:center;justify-items:center;position:relative;padding:0}
.lpStep .lpConn{grid-column:2;justify-self:center;width:12px;height:16px;background:linear-gradient(180deg,rgba(230,120,140,.20),rgba(139,124,246,.28));position:absolute;top:-8px;z-index:0}
.lpStepNum{grid-column:1;justify-self:end;padding-right:14px;font-family:var(--mono);font-size:13px;font-weight:800;color:#8a7b98;text-align:right;line-height:1.2}
.lpStepNum .ly{color:#c084fc;font-size:10px;display:block;font-weight:700}
.lpNode{grid-column:2;width:64px;height:64px;border-radius:50%;background:rgba(30,20,42,.92);border:2.5px solid #3a2e46;
  display:flex;align-items:center;justify-content:center;gap:4px;z-index:2;transition:.15s;position:relative}
.lpStep.lymph .lpNode{border-color:#c084fc;border-style:dashed;box-shadow:0 0 16px -6px #c084fc}
.lpStep.dest .lpNode{border-color:var(--lc,#8b7cf6);box-shadow:0 0 0 3px var(--lc,#8b7cf6),0 0 22px -4px var(--lc,#8b7cf6);cursor:pointer;background:rgba(48,34,62,.98)}
.lpStep.dest:active .lpNode{transform:scale(.94)}
.lpGoSide{grid-column:3;justify-self:start;padding-left:14px;font-size:11px;font-weight:700;color:var(--lc,#8b7cf6)}
/* tokens on the node */
.lpTok,.lpCell{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:11px;font-size:17px;font-weight:800;position:relative}
.lpTok{background:#3a2030;color:#fff}
.lpTok.tg{box-shadow:0 0 0 2px var(--good),0 0 12px -2px var(--good);cursor:pointer}
.lpTok .lpHp{position:absolute;bottom:-7px;right:-4px;font-size:8px;background:#150a17;border-radius:4px;padding:0 3px;font-style:normal;color:#fbbf24}
.lpCell{color:#150a17;cursor:pointer;box-shadow:0 0 10px -2px #fff;border:2px solid #fff}
.lpCell.me{box-shadow:0 0 0 2px #fff,0 0 14px -1px #fff}
/* real art icons with the identifying colour as a ring/background */
/* EVENT ALERT — a fixed top strip so a crisis/relief event is never missed */
#eventAlert{position:fixed;left:50%;top:10px;transform:translateX(-50%) translateY(-140%);
  z-index:120;max-width:min(680px,94vw);display:flex;align-items:flex-start;gap:11px;
  padding:11px 14px;border-radius:13px;background:#1b1020;border:2px solid var(--bad);
  box-shadow:0 18px 44px -14px #000;transition:transform .34s cubic-bezier(.2,.9,.3,1.2)}
#eventAlert.show{transform:translateX(-50%) translateY(0)}
#eventAlert.good{border-color:var(--good)}
#eventAlert .eaIc{font-size:20px;line-height:1.1}
#eventAlert .eaT{font-weight:900;font-size:14.5px;color:#fff}
#eventAlert .eaS{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px}
#eventAlert .eaX{margin-left:6px;background:transparent;border:0;color:var(--faint);font-size:19px;cursor:pointer;line-height:1}
#eventAlert .eaX:hover{color:#fff}
.artIcon{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.06);border:2.5px solid var(--ring,#888);position:relative;box-shadow:0 0 10px -3px var(--ring,#888)}
.artIcon img{width:40px;height:40px;object-fit:contain;display:block}
.artIcon.path{border-radius:12px}
.artIcon.tg{box-shadow:0 0 0 3px var(--good),0 0 14px -2px var(--good);cursor:pointer}
.artIcon.me{box-shadow:0 0 0 3px #fff,0 0 16px -2px var(--ring,#fff)}
.artIcon .lpHp{position:absolute;bottom:-6px;right:-4px;font-size:8px;background:#150a17;border-radius:4px;padding:0 3px;font-style:normal;color:#fbbf24}
.organImg{width:56px;height:56px;object-fit:contain;display:block}
/* occupants (resident / germs) sitting AT the organ — placed beside it, not overlapping */
.organOccupantsRow{display:flex;gap:8px;margin-top:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.artIcon.resident{border-style:double;border-width:3px}
.artIcon.resident.me{box-shadow:0 0 0 3px #fff,0 0 16px -2px var(--ring)}
.lpDot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22)}
/* entry/exit caps — also centered in the column, connected by the vessel */
.lpEndcap{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0 2px;position:relative;z-index:2}
.lpEndcap .lpConn{position:absolute;top:-8px;width:12px;height:16px;background:linear-gradient(180deg,rgba(139,124,246,.28),rgba(230,120,140,.20));z-index:0}
.lpEndcap.dest{cursor:pointer}
.lpHubGlyph{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff9aa5,#e6394b);display:grid;place-items:center;color:#fff;font-size:26px;box-shadow:0 0 20px -4px #e6394b}
.lpEndcap.dest .lpHubGlyph,.lpEndcap.dest .lpOrganArt{box-shadow:0 0 0 3px #fb5c6c,0 0 24px -4px #fb5c6c}
.lpOrganArt{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:rgba(30,20,42,.9);border:2.5px solid var(--oc,#7c2530)}
.lpOrganName{font-size:15px;font-weight:800;color:#f3e9fb}
.lpOrganHp{display:flex;gap:3px;margin-top:2px}
.lpOrganHp i{width:16px;height:6px;border-radius:3px;background:var(--good)}
.lpOrganHp i.x{background:#3a2a3a}
.lpCapLabel{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#c9b6dc}
.lpHubGo{margin-top:6px;background:rgba(255,255,255,.08);border:1px solid #4a3860;color:#e9d5ff;border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:700;cursor:pointer}
.lpGo{position:absolute;right:12px;font-size:10.5px;color:var(--lc);font-weight:700}
.lpTok{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;border-radius:9px;font-size:15px;font-weight:800;background:#3a2030;color:#fff;position:relative}
.lpTok.tg{box-shadow:0 0 0 2px var(--good),0 0 14px -3px var(--good);cursor:pointer}
.lpTok .lpHp{position:absolute;bottom:-7px;right:-4px;font-size:8px;background:#150a17;border-radius:4px;padding:0 3px;font-style:normal;color:#fbbf24}
.lpCell{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;font-weight:800;font-size:14px;color:#150a17;cursor:pointer;box-shadow:0 0 10px -2px #fff}
.lpHub{display:flex;align-items:center;gap:12px;background:rgba(40,14,20,.9);border:1.5px solid #7c2530;border-radius:14px;padding:12px 14px;min-height:62px}
.lpHub.dest{border-color:#fb5c6c;box-shadow:0 0 0 2px #fb5c6c,0 0 20px -4px #fb5c6c;cursor:pointer}
.lpHubGlyph{width:40px;height:40px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff9aa5,#e6394b);display:grid;place-items:center;color:#fff;font-size:20px}
.lpHubLabel{font-weight:800;color:#ffd9dd}
.lpActs{flex:none;background:rgba(18,12,24,.96);border-top:1px solid #33263e;padding:12px 16px calc(12px + env(safe-area-inset-bottom));max-width:520px;width:100%;margin:0 auto}
.lpActsCell{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#efe6f6;margin-bottom:8px}
.lpActsGlyph{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#150a17;font-weight:800}
.lpActsBtns{display:flex;flex-wrap:wrap;gap:8px}
.lpHint{font-size:12.5px;color:#9c8ba8;text-align:center}
/* organ cap + resident + hp in branch panel */
.lpOrgan .lpOrganHp{display:flex;gap:3px;margin-top:4px}
.lpOrgan .lpOrganHp i{width:14px;height:5px;border-radius:2px;background:var(--good)}
.lpOrgan .lpOrganHp i.x{background:#3a2a3a}
.lpHubGo{margin-left:auto;background:rgba(255,255,255,.08);border:1px solid #4a3860;color:#e9d5ff;border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
/* lymph hop arrows at the crossing */
.lpHopRow{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.lpHop{display:inline-flex;flex-direction:column;align-items:center;gap:1px;background:rgba(192,132,252,.16);border:1px solid #c084fc;color:#e9d5ff;border-radius:10px;padding:6px 11px;font-size:12px;font-weight:800;cursor:pointer}
.lpHop i{font-style:normal;font-size:9.5px;font-weight:600;opacity:.85}
.lpHop.off{opacity:.32;cursor:not-allowed;border-style:dashed}
.lpHop:not(.off):active{transform:scale(.96)}
/* bloodstream arrow view */
.lpBlood{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 14px 12px;max-width:560px;width:100%;margin:0 auto}
.lpArrowGroup{background:rgba(20,13,26,.6);border:1px solid #2a1f38;border-radius:14px;padding:10px}
.lpGroupLbl{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9c8ba8;margin-bottom:8px;text-align:center}
.lpArrows{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.lpArrow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:rgba(30,20,40,.7);border:1.5px solid #33263e;border-radius:11px;padding:10px 12px;cursor:pointer;text-align:left;transition:.15s}
.lpArrow .laName{font-size:13px;font-weight:800;color:#efe6f6}
.lpArrow .laInfo{font-size:12px;font-weight:700}
.lpArrow .laInfo.clear{color:#5c7c6c}
.lpArrow .laInfo.threat{color:#fb7185}
.lpArrow.threat{border-color:#fb5c6c;box-shadow:0 0 14px -5px #fb5c6c;animation:pl 1.8s infinite}
.lpArrow.clear{opacity:.72}
.lpArrow.reach{border-left:4px solid var(--good)}
.lpArrow:active{transform:scale(.97)}
.lpHubBig{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px}
.lpHubGlyph.big{width:64px;height:64px;font-size:30px;box-shadow:0 0 30px -6px #e6394b}
.lpArrowNote{font-size:11.5px;color:#c9b6dc;text-align:center;max-width:220px;margin-top:6px}
.lpArrow.noreach{opacity:.35;cursor:not-allowed}
.lpArrow.viewonly{cursor:pointer}
.lpCell.me{box-shadow:0 0 0 2px #fff,0 0 12px -1px #fff}
.lpLymphNav{background:rgba(192,132,252,.1);border:1px solid #6d4a8a;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.lpLymphLbl{font-size:11px;color:#d8b8f0;margin-bottom:6px;font-weight:700}
.lpLymphNav .lpHop{margin-right:6px}
.bt.disabledWhy{opacity:.42;cursor:help;position:relative}
.bt.disabledWhy:active{opacity:.6}
.lpWhy{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);z-index:320;background:rgba(30,18,40,.98);border:1px solid #a78bfa;color:#f3e9fb;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;max-width:88%;text-align:center;box-shadow:0 18px 44px -16px #000;opacity:0;pointer-events:none;transition:.28s;line-height:1.35}
.lpWhy.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* B-Cell produce class picker */
.producePicker{z-index:210}
.pcIntro{max-width:520px;margin:8px auto 4px;padding:0 16px;font-size:12.5px;color:#c9b6dc;text-align:center;flex:none}
.pcGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr;gap:10px;padding:10px 16px 16px;max-width:520px;width:100%;margin:0 auto}
.pcCard{text-align:left;background:rgba(26,18,34,.9);border:1.5px solid var(--fc);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s;box-shadow:0 0 0 0 var(--fc)}
.pcCard:active{transform:scale(.98);box-shadow:0 0 18px -4px var(--fc)}
.pcCard.full{opacity:.5;cursor:not-allowed;border-style:dashed}
.pcHead{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.pcTag{font-family:var(--mono);font-weight:800;font-size:11px;color:#150a17;padding:2px 8px;border-radius:6px;letter-spacing:.05em}
.pcName{font-weight:800;font-size:14px;color:#f3e9fb}
.pcBio{font-size:11.5px;color:#a99bbb;line-height:1.35;margin-bottom:8px}
.pcFoot{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.pcStore{color:#c9b6dc}.pcStore b{color:#fff}
.pcRate{font-weight:800;color:var(--fc)}
.pcRate.up{color:#6ee7a8}
.pcRate.dn{color:#fbbf24}
/* off = looks disabled but still tappable to explain why */
.bt.off{opacity:.4}
.bt.off:active{opacity:.6}
/* topmost tap tooltip at the click location */
.tapTip{position:fixed;transform:translate(-50%,-100%);z-index:99999;background:#2a1030;border:1.5px solid #fb7185;color:#ffe9ec;padding:9px 13px;border-radius:11px;font-size:12.5px;font-weight:600;max-width:250px;text-align:center;line-height:1.35;box-shadow:0 14px 40px -10px #000,0 0 0 1px rgba(255,255,255,.06);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.tapTip.show{opacity:1;transform:translate(-50%,-110%)}
.tapTip::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fb7185}
svg.anat{position:absolute;inset:0;width:100%;height:100%}
.layer{position:absolute;inset:0;z-index:6;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-40}}
.vessel-flow{animation:flow 2.4s linear infinite}

/* #16 — the bloodstream is a translucent zone at the BOTTOM, not a solid disc on top */
.plaza{position:absolute;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;
  z-index:1;pointer-events:none;
  background:radial-gradient(circle at 50% 45%,rgba(230,57,75,.14),rgba(230,57,75,.05) 60%,transparent 72%);
  border:1.5px dashed rgba(230,57,75,.4);animation:plazaPulse 3s ease-in-out infinite}
@keyframes plazaPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}50%{transform:translate(-50%,-50%) scale(1.05);opacity:1}}
.hub{position:absolute;transform:translate(-50%,-50%);z-index:2;pointer-events:auto;cursor:help}
.hubCore{width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,rgba(255,133,147,.5),rgba(230,57,75,.35) 55%,rgba(150,26,42,.3));
  border:1.5px solid rgba(255,133,147,.55);
  box-shadow:0 0 18px 3px var(--heartGlow);
  display:grid;place-items:center;animation:beat 1.15s ease-in-out infinite}
/* distinct antigen-class icons */
.famIcon{vertical-align:middle;margin-right:3px;flex-shrink:0}
.abtag{display:inline-flex;align-items:center;gap:1px}
.famchip{display:inline-flex;align-items:center;gap:2px}
/* #7 — token spotlighted from its card */
.iv.lit{animation:litpulse 1s ease-in-out infinite}
@keyframes litpulse{0%,100%{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px var(--good))}50%{filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 18px var(--good))}}
/* #1 — tooltip edge clamping */
.tip.clamp{left:auto;transform:none}
.tip.clamp::after{left:var(--arrow,50%)}
.hubCore b{font-size:15px;color:rgba(255,220,225,.92);text-align:center;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.6)}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.13)}24%{transform:scale(1)}36%{transform:scale(1.07)}}
.blob{position:absolute;transform:translate(-50%,-50%);width:30px;height:25px;z-index:5;pointer-events:auto;cursor:pointer;
  border-radius:54% 46% 42% 58%/58% 54% 46% 42%;transition:.25s}
.blob:hover{transform:translate(-50%,-50%) scale(1.15)}
.chip{position:absolute;transform:translate(-50%,-50%);width:104px;border-radius:11px;padding:6px 7px;text-align:center;z-index:8;
  background:linear-gradient(180deg,rgba(38,22,42,.97),rgba(24,13,27,.97));border:1.5px solid var(--line2);
  box-shadow:0 10px 26px -14px rgba(0,0,0,.9);pointer-events:auto;cursor:pointer;transition:.15s}
.chip:hover{transform:translate(-50%,-50%) scale(1.05)}
.chip .cn{font-weight:800;font-size:11.5px;line-height:1.1}
.chip .ck{font-family:var(--mono);font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:1px}
.chip .hp{display:flex;gap:3px;justify-content:center;margin-top:5px}
.chip .hp i{width:14px;height:5px;border-radius:2px;background:var(--good);box-shadow:0 0 6px -1px var(--good)}
.chip .hp i.x{background:rgba(255,255,255,.13);box-shadow:none}
.chip .ef{font-size:8px;color:var(--bad);margin-top:3px;font-weight:700;line-height:1.25}
.chip.hurt{border-color:var(--antibody)}
.chip.crit{border-color:var(--bad);box-shadow:0 0 18px -3px var(--bad);animation:pl 1.1s infinite}
.entry{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);background:rgba(18,9,20,.94);border:1px solid var(--line2);border-radius:6px;padding:3px 6px;z-index:5;white-space:nowrap}
.entry b{color:var(--labc)}

.tk{position:absolute;transform:translate(-50%,-50%);transition:left .45s cubic-bezier(.4,0,.2,1),top .45s cubic-bezier(.4,0,.2,1),opacity .3s}
.iv{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;pointer-events:auto;position:relative}
.iv .bo{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:900;color:#0c0710;position:relative}
.iv.virus .bo{background:radial-gradient(circle at 34% 30%,#ff9a9a,var(--virus));box-shadow:0 0 11px -2px var(--virus)}
.iv.virus .bo::before{content:"";position:absolute;top:50%;left:50%;width:3px;height:3px;border-radius:50%;background:#ff9a9a;transform:translate(-50%,-50%);z-index:-1;
  box-shadow:12px 0 0 var(--virus),10px 7px 0 var(--virus),4px 11px 0 var(--virus),-4px 11px 0 var(--virus),-10px 7px 0 var(--virus),-12px 0 0 var(--virus),-10px -7px 0 var(--virus),-4px -11px 0 var(--virus),4px -11px 0 var(--virus),10px -7px 0 var(--virus)}
.iv.hidden .bo{background:radial-gradient(circle at 34% 30%,rgba(213,155,245,.26),rgba(180,92,240,.13));border:1.5px dashed #dcb0f7;color:rgba(246,238,242,.85)}
.iv.hidden .bo::before{content:"";position:absolute;top:50%;left:50%;width:3px;height:3px;border-radius:50%;background:rgba(220,176,247,.45);transform:translate(-50%,-50%);z-index:-1;
  box-shadow:11px 0 0 rgba(180,92,240,.36),9px 6px 0 rgba(180,92,240,.36),4px 10px 0 rgba(180,92,240,.36),-4px 10px 0 rgba(180,92,240,.36),-9px 6px 0 rgba(180,92,240,.36),-11px 0 0 rgba(180,92,240,.36),-9px -6px 0 rgba(180,92,240,.36),-4px -10px 0 rgba(180,92,240,.36),4px -10px 0 rgba(180,92,240,.36),9px -6px 0 rgba(180,92,240,.36)}
.iv.bacteria .bo{width:22px;height:16px;border-radius:58% 42% 52% 48%/62% 55% 45% 38%;background:radial-gradient(circle at 32% 28%,#dcec93,var(--bacteria));box-shadow:0 0 11px -2px var(--bacteria)}
/* TOXIN / VENOM — a hazard diamond: not alive, so it looks chemical, not biological */
.iv.toxin .bo,.iv.venom .bo{width:19px;height:19px;border-radius:3px;transform:rotate(45deg);
  background:linear-gradient(135deg,#bef264,var(--toxin));box-shadow:0 0 12px -1px var(--toxin);color:#14290a;font-size:10px}
.iv.toxin .bo::after,.iv.venom .bo::after{content:"";position:absolute;inset:2px;border:1px dashed rgba(20,41,10,.55);border-radius:2px}
/* FUNGUS — spiky, branching hyphae */
.iv.fungus .bo{background:radial-gradient(circle at 35% 32%,#ddd6fe,var(--fungus));box-shadow:0 0 11px -2px var(--fungus)}
.iv.fungus .bo::before{content:"";position:absolute;top:50%;left:50%;width:2px;height:2px;transform:translate(-50%,-50%);z-index:-1;background:var(--fungus);
  box-shadow:0 -13px 0 1px var(--fungus),0 13px 0 1px var(--fungus),-13px 0 0 1px var(--fungus),13px 0 0 1px var(--fungus),
             -9px -9px 0 0 var(--fungus),9px 9px 0 0 var(--fungus),-9px 9px 0 0 var(--fungus),9px -9px 0 0 var(--fungus)}
/* WORM — long segmented body */
.iv.worm .bo{width:28px;height:13px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--worm) 0 4px,#fcd34d 4px 7px);
  box-shadow:0 0 11px -2px var(--worm);color:#3a2400;font-size:9px}
/* PARASITE (protozoa) — an amoeba-ish irregular blob */
.iv.parasite .bo{background:radial-gradient(circle at 35% 30%,#f5d0fe,var(--parasite));box-shadow:0 0 11px -2px var(--parasite);
  border-radius:62% 38% 46% 54%/48% 62% 38% 52%}
.iv.inmac .bo{outline:2px solid #a5866a;outline-offset:2px}
/* MALARIA — crescent (the real parasite is banana-shaped!) */
.iv.malaria .bo{background:radial-gradient(circle at 35% 32%,#a5f3fc,var(--malaria));box-shadow:0 0 12px -2px var(--malaria);
  border-radius:60% 40% 55% 45%/50% 60% 40% 50%}
.iv.malaria.liver .bo{border:1.6px dashed #67e8f9;background:radial-gradient(circle at 35% 30%,rgba(103,232,249,.25),rgba(34,211,238,.12))}
/* HP pips for multi-hit invaders */
.iv .hpbar{position:absolute;top:-8px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.iv .hpbar i{width:5px;height:3px;border-radius:1px;background:#fff;box-shadow:0 0 3px #000}
.iv .hpbar i.x{background:rgba(255,255,255,.22)}
.iv.ade{outline:2px dashed var(--bad);outline-offset:3px}
.iv.tagged::after{content:"Y";position:absolute;top:-7px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--antibody);color:#3a2600;
  font-family:var(--mono);font-weight:900;font-size:9px;display:grid;place-items:center;border:1.5px solid #7a5600;box-shadow:0 0 8px -1px var(--antibody)}
.iv .ct{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;font-weight:800;background:#000;color:#fff;padding:0 4px;border-radius:6px;border:1px solid var(--line2)}
.iv.tg{outline:3px solid #fff;outline-offset:2px;cursor:pointer;animation:tp 1s infinite}
@keyframes tp{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,.75))}50%{filter:drop-shadow(0 0 8px rgba(255,255,255,1))}}
.ctk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-weight:900;font-size:12px;color:#fff;
  pointer-events:auto;border:2px solid rgba(255,255,255,.92);box-shadow:0 3px 10px -2px rgba(0,0,0,.7);position:relative;cursor:pointer;transition:.14s}
.ctk:hover{transform:scale(1.1)}
.ctk.sl{transform:scale(1.17);box-shadow:0 0 0 3px #fff,0 0 18px 3px rgba(255,255,255,.5)}
.ctk.aura::after{content:"";position:absolute;inset:-6px;border-radius:12px;border:2px dashed var(--c-helper);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rtk{width:28px;height:28px;border-radius:8px;background:linear-gradient(180deg,#7a5f45,#4d3a29);border:2px solid #a5866a;
  display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:900;color:#ffe3bd;pointer-events:auto;cursor:pointer;transition:.14s;
  box-shadow:0 3px 10px -2px rgba(0,0,0,.7)}
.rtk:hover{transform:scale(1.1)}
.rtk.sl{box-shadow:0 0 0 3px #fff,0 0 14px 2px rgba(255,255,255,.45)}
.rtk.infected{background:linear-gradient(180deg,#6b2d6b,#3d1a3d);color:#f5d0fe;animation:pl 1.3s infinite}
.gh{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:2.5px dashed #fff;background:rgba(18,9,20,.72);
  pointer-events:auto;cursor:pointer;z-index:30;animation:tp 1s infinite;display:grid;place-items:center}
.gh span{font-family:var(--mono);font-size:9px;color:#fff;font-weight:800}
.tk.gone{opacity:0!important;transform:translate(-50%,-50%) scale(.2)!important}

.sd{display:flex;flex-direction:column;gap:10px;min-height:0;height:100%;overflow-y:auto;padding-right:3px}
.cp{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.cp .span2{grid-column:1 / -1}
.cc{border:1px solid var(--line);border-radius:10px;padding:8px;background:rgba(255,255,255,.035);cursor:pointer;transition:.13s}
.cc:hover{background:rgba(255,255,255,.08)}.cc.sl{border-color:#fff;box-shadow:0 0 0 1px #fff}.cc.off{opacity:.45}
.cc .tp{display:flex;align-items:center;gap:7px}
.cc .nm{font-weight:800;font-size:12px;line-height:1.1}.cc .rl{font-size:9.5px;color:var(--muted)}
.cc .ps{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--muted);text-align:right}
.gl{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-weight:900;font-size:12px;color:#fff;flex:none}
.acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
/* collapsible panels */
.fold{padding:0;overflow:hidden}
.fold>summary{padding:10px;cursor:pointer;font-size:11.5px;font-weight:800;color:var(--muted);list-style:none;
  display:flex;align-items:center;gap:6px;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸";color:var(--faint);transition:.15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.fold>*:not(summary){padding:0 10px 10px}
/* hover explainer cards */
.tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);
  width:250px;background:linear-gradient(180deg,#241328,#170c1a);border:1px solid var(--line2);border-radius:11px;
  padding:9px 10px;box-shadow:0 20px 50px -18px #000;opacity:0;pointer-events:none;transition:.16s;z-index:80;text-align:left}
.abcell:hover .tip,.famchip:hover .tip{opacity:1}
.tip.clamp{left:auto;transform:none}
.tip.clamp::after{left:var(--arrow,50%)}
/* fixed-position mode: escapes the scrollable side panel so nothing is clipped */
.tip.fixedtip{position:fixed;bottom:auto;left:0;top:0;transform:none;margin:0;z-index:200}
.tip.fixedtip::after{left:var(--arrow,50%)}
.tip.fixedtip.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#170c1a}
.tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#170c1a}
.tipHead{font-weight:900;font-size:12px;margin-bottom:3px}
.tipWhy{font-size:10.5px;color:var(--muted);line-height:1.45}
.tipEg{font-size:10px;color:var(--faint);margin-top:5px;padding-top:5px;border-top:1px solid var(--line);line-height:1.45}
.tipEg b,.tipNow b{color:var(--ink)}
.tipNow{font-size:10px;margin-top:4px;font-weight:700;line-height:1.4}
.famchip{position:relative;font-family:var(--mono);font-size:9px;font-weight:900;border:1px solid;border-radius:5px;padding:1px 4px;cursor:help}
/* antibody classes */
.abgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}
.abcell{position:relative;border:1px solid var(--line);border-radius:9px;padding:6px;background:rgba(255,255,255,.03);transition:.14s;cursor:help}
.abcell.hot{background:rgba(255,255,255,.07)}
.abcell.pick{cursor:pointer;border-style:dashed;animation:tp 1.2s infinite}
.abcell.pick:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.abcell.locked{opacity:.5}
.abtop{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.abtag{font-family:var(--mono);font-size:9px;font-weight:900;border:1px solid;border-radius:5px;padding:1px 4px}
.abthreat{font-size:8.5px;font-weight:800;margin-left:auto}
.abmat{color:var(--antibody);font-size:11px;margin-left:auto}
.abpips{display:flex;gap:2px;margin-bottom:3px}
.abpips i{flex:1;height:6px;border-radius:2px;background:rgba(255,255,255,.10);border:1px solid rgba(0,0,0,.35)}
.abpips i.on{background:linear-gradient(180deg,#fcd34d,#e0900f);box-shadow:0 0 7px -1px var(--antibody)}
.abrate{font-family:var(--mono);font-size:8.5px;color:var(--faint)}
.abrate.boosted{color:#6ee7a8;font-weight:700}
.abrate.reduced{color:#fbbf24;font-weight:700}
.abrate .rup{color:#6ee7a8}
.abrate .rdn{color:#fbbf24}
/* production breakdown inside the card tip */
.pbHead{font-weight:800;font-size:9.5px;letter-spacing:.03em;color:var(--antibody);margin-bottom:3px}
.pbRow{display:flex;justify-content:space-between;gap:12px;font-size:9.5px;font-family:var(--mono);color:var(--muted);padding:1px 0}
.pbRow.pbUp span:last-child{color:#6ee7a8}
.pbRow.pbDn span:last-child{color:#fbbf24}
.pbRow.pbNet{border-top:1px solid var(--line);margin-top:2px;padding-top:3px;color:#fff;font-weight:700}
.pbRow.pbStore{color:var(--faint);margin-top:2px}
.pbNote{font-size:8.5px;color:#fbbf24;font-family:var(--mono)}
.pbSep{height:1px;background:var(--line);margin:6px 0}
.abname{font-size:8.5px;color:var(--muted);line-height:1.15;margin-bottom:4px;min-height:20px}
.abname b{color:var(--ink);font-weight:800}
/* vaccine lab */
.vlist{display:flex;flex-direction:column;gap:5px;max-height:130px;overflow-y:auto}
.vrow{display:flex;align-items:center;gap:6px;font-size:11px}
.vname{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vfam{font-family:var(--mono);font-size:8px;color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:0 3px}
.vbar{width:52px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;flex:none}
.vbar>div{height:100%;background:linear-gradient(90deg,#34d399,#22d3ee)}
.vnum{font-size:9px;color:var(--muted);flex:none;width:26px}
.vimms{display:flex;flex-wrap:wrap;gap:4px}
.vimm{font-size:10px;font-weight:700;color:var(--good);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);border-radius:999px;padding:2px 7px}
.fasttag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:5px;background:#f9731622;color:#fb923c;border:1px solid #fb923c88;vertical-align:middle;margin-left:4px}
.memtag{font-family:var(--mono);font-size:8px;font-weight:900;background:var(--good);color:#062a1d;border-radius:4px;padding:1px 4px;vertical-align:middle}
.meters{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.meter{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;font-size:11.5px;font-weight:700}
.meter.ab{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.32)}
.meter.ag{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.32)}
.yg{width:17px;height:17px;border-radius:50%;background:var(--antibody);color:#3a2600;font-family:var(--mono);font-weight:900;display:grid;place-items:center;font-size:10px}
.ca{border:1px solid var(--line);border-radius:13px;padding:10px;background:rgba(255,255,255,.035)}
.deck{width:94px;height:124px;border-radius:12px;cursor:pointer;background:linear-gradient(160deg,#4d2456,#2a1530);border:1px solid var(--line2);
  display:grid;place-items:center;text-align:center;margin:4px auto;transition:.15s;box-shadow:0 10px 26px -14px #000}
.deck:hover{transform:translateY(-2px)}
.deck .dna{font-size:23px}.deck .t{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.thr{border-radius:11px;border:1.5px solid var(--line2);overflow:hidden}
.thr .hd{padding:9px 11px;display:flex;align-items:center;gap:9px}
.thr .mt{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;overflow:hidden;background:#150c1c !important;border:2px solid var(--mtc,#888);box-shadow:0 0 10px -3px var(--mtc,#888)}
.thr .mt .mtimg{width:78%;height:78%;object-fit:contain;border-radius:0}
.thr .dz{font-weight:900;font-size:15px}.thr .mb{font-size:10px;color:var(--muted);font-family:var(--mono)}
.thr .bb{padding:9px 11px;border-top:1px solid var(--line);background:rgba(0,0,0,.2)}
.opill{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:999px;margin:2px 3px 0 0;border:1px solid}
.thr .beat{font-size:11px;line-height:1.5;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line2)}.thr .beat b{color:var(--ink)}

/* =========================================================================
   THE IMMUNITY WARS — ORGAN TOPOLOGY ENGINE (experimental, headless-first)

   Board:  entry route (3-4 steps) -> BLOODSTREAM HUB -> organ branch (3-4) -> ORGAN
   Tropism: each disease can infect only certain organs. The organ is rolled
            AT THE HUB, independently per invader — so a divided swarm fans out.
   Organs:  integrity 3 (brain 2). Reaching an organ = -1 integrity.
            Organ at 0 = organ failure = loss. Organs heal after clear turns.
   Resident macrophages: alveolar / Kupffer / microglia — a stationary last
            line at each organ; eats ONE arriving eligible invader per turn.
   ========================================================================= */

const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const clone = o => JSON.parse(JSON.stringify(o));
let _uid=0; const uid=()=>"i"+(++_uid);
const d6=()=>1+Math.floor(Math.random()*6);
const cap1=s=>s? s[0].toUpperCase()+s.slice(1) : s;

/* ---------------- ORGANS ---------------- */
/* kind: "vital" = you die if it fails, but immunity unaffected
         "defence" = damaging it weakens your immune system              */
const ORGANS = {
  heart:   { name:"Heart",       kind:"vital",   integrity:3, branch:2, effect:"-1 Action Point (weak pump)", bio:"The heart itself can be infected — Staph on the valves (endocarditis), Lyme carditis, viral myocarditis. Germs only passing through the bloodstream do NOT infect it; only germs that target heart tissue do." },
  lungs:   { name:"Lungs",       kind:"vital",   integrity:3, branch:3, effect:"-1 Action Point",              bio:"Damaged lungs mean poor gas exchange — the whole body weakens." },
  liver:   { name:"Liver",       kind:"defence", integrity:3, branch:3, effect:"Antibody storage capped at 2 per class",   bio:"The liver makes many defence proteins; damage it and antibody supply falls." },
  marrow:  { name:"Bone Marrow", kind:"defence", integrity:3, branch:3, effect:"Neutrophil cannot regenerate", bio:"All immune cells are made in the marrow." },
  brain:   { name:"Brain",       kind:"vital",   integrity:2, branch:3, effect:"None — but fragile & slow to defend", bio:"Immune privilege: the blood-brain barrier keeps immune cells out, so it is hard to defend and cannot take much damage." },
  spleen:  { name:"Spleen",      kind:"defence", integrity:3, branch:3, effect:"Bacteria divide on 1–3",       bio:"The spleen filters encapsulated bacteria from the blood — without it, bacterial infection runs wild." },
  kidneys: { name:"Kidneys",     kind:"vital",   integrity:3, branch:3, effect:"Lose 1 antibody each turn",    bio:"Damaged kidneys leak antibodies into the urine — a real cause of secondary immunodeficiency." },
};
// All difficulties use the SAME full body — 7 organs — so the physical board is identical at every
// level (only AP, spawn rate and division scale with difficulty). We measured that organ/lane count
// barely affects win-rate, and a uniform board is far easier to print and to port to cardboard.
const ALL_ORGANS = ["heart","lungs","liver","marrow","brain","spleen","kidneys"];
const ORGAN_SETS = {

  normal:   ALL_ORGANS,
  hard:     ALL_ORGANS,

const ROUTES = { nose:{name:"Nose",len:5},   gut:{name:"Gut",len:5},     contact:{name:"Contact",len:5},

                 blood:{name:"Blood",len:3} };   // BLOOD is SHORT: a needle bypasses the tissue barrier entirely  // uniform: totals land at 8-10 marches

// Skin routes share regional drainage. BLOOD has NO lymphatic link: a needle goes straight in,
// bypassing the tissues — which is exactly why it is the most dangerous way to be infected.
const LYMPH_GROUP = { nose:"mucosal", gut:"mucosal", contact:"mucosal", wound:"skin", bite:"skin", blood:null };
function lymphPartners(lane){ const g=LYMPH_GROUP[lane]; if(!g) return [];
  return ROUTE_KEYS.filter(l=>l!==lane && LYMPH_GROUP[l]===g && ROUTES[l].len>=LYMPH_STEP); }
const PAIR = { nose:"gut", gut:"nose", bite:"wound", wound:"bite" };
const LYMPH_STEP = 3;   // the lymphatic crossing point on each route (mid-route)

/* Which organs each disease can actually infect. "any" = generalist. */

function scheduleEvents(g){
  const T=g.maxTurn, raw=[Math.round(T*0.25),Math.round(T*0.5),Math.round(T*0.75)], slots=[];
  raw.forEach(t=>{ t=Math.max(2,Math.min(T-1,t)); while(slots.includes(t)) t++; slots.push(t); });
  const picks=shuffle([...shuffle(BAD_POOL.slice()).slice(0,2), ...shuffle(GOOD_POOL.slice()).slice(0,1)]);
  slots.forEach((t,i)=>{ g.events[t]=picks[i]; });

/* --- worm caps: may another worm arrive right now? --- */

function respectWormCap(g, c){
  if(!c || c.type!=="worm" || wormAllowed(g)) return c;
  // Pull the first NON-worm out of the deck (searching the whole deck, not just the top).
  let i=g.deck.findIndex(x=>x.type!=="worm");
  if(i>=0){ const alt=g.deck.splice(i,1)[0]; g.discard.push(alt); return alt; }
  // Deck exhausted of non-worms: reshuffle the discard and look once more.
  if(g.discard.length){
    g.deck=shuffle(g.discard.splice(0));
    i=g.deck.findIndex(x=>x.type!=="worm");
    if(i>=0){ const alt=g.deck.splice(i,1)[0]; g.discard.push(alt); return alt; }

function hivActive(g){ return g.flags.specials && g.invaders.some(iv=>iv.killsHelper && iv.zone!=="route"); }

function macDisabled(g,o){ const r=g.residents[o]; return !!(r && r.infectedBy); }

  if(iv.type==="fungus"){ // OPPORTUNISTIC: fast while the body is weakened
    const weak = !g.cells.neutrophil.alive || (g.organs.marrow && damaged(g,"marrow")) || (g.suppress&&g.suppress.neutrophil>0);

}
function hurtInvader(g,iv,dmg,by){

function wormStrikeable(g,ck){ const c=g.cells[ck];

function antivenomTargets(g){ return g.invaders.filter(iv=> iv.type==="venom"); }
const RESIDENT_NAME={heart:"Cardiac macrophage",lungs:"Alveolar macrophage",liver:"Kupffer cell",brain:"Microglia",marrow:"Marrow macrophage",spleen:"Splenic macrophage",kidneys:"Renal macrophage"};
function nkTargets(g){ const n=g.cells.nk;

    if(n.zone!==iv.zone){ if(iv.zone==="hub") return n.step<=NK_RANGE; return false; }

function residentEatable(g,o){ const r=g.residents[o]; if(!r || r.infectedBy) return [];
  return g.invaders.filter(iv=> iv.zone==="branch" && iv.organ===o && iv.step===r.step
    && (iv.type==="virus" || (iv.type==="bacteria"&&iv.tagged) || (iv.type==="malaria"&&(iv.stage==="blood"||iv.stage==="sporozoite"))) ); }
const CNAME={macrophage:"Monocyte",neutrophil:"Neutrophil",bcell:"B-Cell",tcell:"Killer T-Cell",helper:"Helper T-Cell",nk:"NK Cell"};
function cname(ck){ return CNAME[ck]||cap1(ck); }
function placeName(d){ return d.zone==="hub"?"the bloodstream":(d.zone==="route"? `${ROUTES[d.lane].name} ${d.step}` : (d.step===0? `the ${ORGANS[d.organ].name} itself` : `${ORGANS[d.organ].name} branch ${d.step}`)); }

/* ---------------- spread ---------------- */
function resolveSpread(g){
  g.phase="spread"; const frames=[]; const snap=(label,dice)=>frames.push({label,dice:dice||null,view:viewState(g)});

  // EARLY CLEARANCE CHECK — if the onslaught window has closed and the board is already clear,
  // the body has won before this turn's spread even runs.
  if(g.turn>g.maxTurn && g.everInfected && g.invaders.length===0){
    g.won=true; pushLog(g,`Every infection faced and the body is completely clear — you win!`,"good"); snap("Victory"); return frames;
  }

  // 0) COMPLEMENT — blood proteins continuously coat bacteria in the bloodstream (opsonisation, free)
  if(g.flags.complement){
    const b=g.invaders.find(iv=>iv.type==="bacteria" && !iv.tagged && iv.zone==="hub");
    if(b){ b.tagged=true; pushLog(g,`<b>Complement</b> coated ${b.disease} in the bloodstream — a phagocyte can now eat it.`,"good"); snap("Complement"); }
  }

  // 1) BACTERIA DIVIDE — binary fission, scaled by difficulty.
  //    Training : 1→2 on a d6 ≤2  (≈33% chance to add one copy)
  //    Normal   : 1→2 on a d6 ≤3  (50% chance to add one copy)
  //    Hard     : 1→2 GUARANTEED, plus a 50% chance it is a 1→3 split (adds a second copy)
  //    Coated/tagged bacteria never divide (opsonised — flagged for destruction), so TAG EARLY.
  //    DENSITY CAP: a single tissue space saturates — no more than SPACE_CAP bacteria can pack into one
  //    spot. Real bacterial growth is density-limited (nutrients, quorum, local defences). This keeps a
  //    swarm terrifying but finite instead of doubling to infinity.
  const dOn=divideOn(g);
  const untagged=g.invaders.filter(iv=>iv.type==="bacteria"&&!iv.tagged);
  if(untagged.length){ const dice=[],born=[]; const fullSpaces=new Set();
    // count how many bacteria already occupy each space, so we can stop a saturated space multiplying
    const spaceKey=iv=> iv.zone+":"+(iv.lane||"")+":"+(iv.organ||"")+":"+iv.step;
    const count={}; g.invaders.filter(x=>x.type==="bacteria").forEach(x=>{ const k=spaceKey(x); count[k]=(count[k]||0)+1; });
    untagged.forEach(iv=>{
      const k=spaceKey(iv); const room=()=> (count[k]||0) < SPACE_CAP;
      if(!room()){ dice.push({label:iv.disease,face:0,hit:false,full:true}); fullSpaces.add(k); return; }   // this space is saturated
      if(g.difficulty==="hard"){
        born.push({...clone(iv),id:uid()}); count[k]++;                 // guaranteed one copy
        const r=d6(); const triple=r<=3; dice.push({label:iv.disease,face:r,hit:true});
        if(triple && room()){ born.push({...clone(iv),id:uid()}); count[k]++; }   // a second, if room
      } else {
        const r=d6(),hit=r<=dOn; dice.push({label:iv.disease,face:r,hit});
        if(hit){ born.push({...clone(iv),id:uid()}); count[k]++; }
      }
    });
    if(born.length){ g.invaders.push(...born); pushLog(g,`Bacteria <b>divided</b>: ${born.length} new.`,"bad"); }
    if(fullSpaces.size) pushLog(g,`${fullSpaces.size} crowded spot(s) stopped growing — a single tissue space holds at most <b>${SPACE_CAP}</b> bacteria. <i>Real bacterial growth is density-limited. Note the cap is per SPOT, so the same disease can still build up on several spots at once.</i>`);
    snap("Bacteria divide",dice); }

  // 2) lytic cycle
  const pre=[...g.invaders];
  const hid=pre.filter(iv=>iv.type==="hidden");
  if(hid.length){ const dice=[],burst=new Set(),nv=[];
    let anyEuk=false;
    hid.forEach(iv=>{ const r=d6(),hit=r<=BURST_ON; dice.push({label:iv.disease,face:r,hit});
      if(hit){ burst.add(iv.id);
        // A bursting cell releases whatever was living INSIDE it. For a virus that is new virions;
        // but Toxoplasmosis and Chagas disease are PROTOZOA, so the cell spills tachyzoites /
        // trypomastigotes — parasites, not viruses. They come out damaged from rupturing the cell.
        const euk = famOf(iv)==="EUK";
        if(euk) anyEuk=true;
        for(let k=0;k<2;k++){
          const copy={...clone(iv), id:uid(), type: euk?"parasite":"virus"};
          if(euk){ copy.hp=1; copy.maxhp=2; }   // released protozoa are weakened — one strike finishes them
          nv.push(copy);
        } } });
    if(burst.size){ g.invaders=g.invaders.filter(x=>!burst.has(x.id)); g.invaders.push(...nv);
      pushLog(g,`${burst.size} cell(s) <b>burst</b> — ${nv.length} new ${anyEuk?"organism(s) spilled out":"viruses"}!`,"bad"); }
    snap("Cells burst",dice); }
  const freeV=pre.filter(iv=>iv.type==="virus" && g.invaders.some(x=>x.id===iv.id));
  if(freeV.length){ const dice=[]; let n=0;
    freeV.forEach(iv=>{
      // A NOVEL pathogen (Pathogen X) never converts to a hidden virus: that would let a Killer T-Cell
      // snipe it and skip the clonal-selection → X-antibody story the card exists to teach.
      if(iv.novel) return;
      const r=d6(),hit=r<=INFECT_ON; dice.push({label:iv.disease,face:r,hit});
      if(hit){ const t=g.invaders.find(x=>x.id===iv.id); if(t){ t.type="hidden"; n++; } } });
    if(n) pushLog(g,`${n} virus(es) <b>hid inside a cell</b> — antibodies can no longer touch them. The Killer T-Cell (never misses) or the NK Cell (d6 3+) must kill the infected cell.`,"bad");
    snap("Viruses hide",dice); }

  // 2b) TOXIN EMISSION — a toxin-making bacterium left alive starts poisoning you
  if(g.flags.toxins){
    g.invaders.filter(iv=>iv.type==="bacteria" && !iv.tagged && TOXIN_MAKERS[iv.disease]).forEach(iv=>{
      iv.age=(iv.age||0)+1;
      if(iv.age>=TOXIN_AFTER && !iv.emitted){
        iv.emitted=true;
        const tname=TOXIN_MAKERS[iv.disease];
        g.invaders.push({id:uid(),type:"toxin",zone:iv.zone,lane:iv.lane,organ:iv.organ,step:iv.step,
          tagged:false,disease:tname,hp:1,maxhp:1,stage:null,age:0});
        pushLog(g,`The ${iv.disease} you left alive has started releasing <b>${tname}</b>! A toxin is not alive — only antibodies can neutralise it.`,"bad");
      }

      iv.embed--;
      if(iv.embed<=0) burst.push(iv);
    });
    burst.forEach(iv=>{
      g.invaders=g.invaders.filter(x=>x.id!==iv.id);
      for(let k=0;k<3;k++) g.invaders.push({id:uid(),type:"malaria",stage:"blood",zone:"hub",lane:iv.lane,organ:null,step:0,
        tagged:false,disease:"Malaria (blood)",hp:1,maxhp:1,age:0,embed:0});
      pushLog(g,`<b>Malaria burst out of the liver</b> — 3 blood-stage parasites are now in the bloodstream. NOW antibodies work on them.`,"bad");
    });
    if(burst.length) snap("Malaria bursts");
  }

  // 2d) CHRONIC WORM DAMAGE — every lodged worm chews its organ on a countdown
  {
    const bites=[];
    g.invaders.filter(iv=>iv.type==="worm" && iv.lodged).forEach(iv=>{
      iv.wormClock=(iv.wormClock||WORM_DAMAGE_EVERY)-1;
      if(iv.wormClock<=0){ iv.wormClock=WORM_DAMAGE_EVERY;

        if(org){ org.hp=Math.max(0,org.hp-1); org.clear=0; g.stats.organHits++; bites.push(iv);
          if(org.hp===0 && !org.failed){ org.failed=true; g.stats.failures.push(iv.organ); }
        }
      }
    });

    if(bites.length) snap("Worms feed");

  //     A pathogen sitting at the lymph crossing has a chance to seed a COPY into the paired route
  //     (mucosal↔mucosal, skin↔skin). This is how real infections (and cancers) spread between regions.
  //     It surprises players who think the lymphatics are theirs alone — but it is exactly true to biology.
  if(g.difficulty==="hard"){

    hoppers.forEach(iv=>{

    const enteredHubLastTurn = iv.justEnteredHub;

    const steps=invSpeed(g,iv);

          // defenders (and complement) get their shot. Without this, a fast pathogen would pass straight
          // through the blood into an organ, untargetable. It rolls for an organ on a LATER turn.
          iv.justEnteredHub=true;

        }

        // at the start of this turn's upkeep). It now rolls for an organ and leaves.
        const o=rollOrgan(g,iv);

      } else if(iv.zone==="branch"){

  const tally=iv=> iv.type==="bacteria" ? (iv.tagged?"bacteriaTagged":"bacteriaUntagged") : iv.type;
  arrivals.forEach(iv=>{ g.stats.arrivals[tally(iv)]++; });

  // 4) RESIDENT MACROPHAGES are now player-controlled (move for 1 AP each, engulf once free) —
  //    they no longer engulf automatically. See the "resmove" / "resengulf" actions.


  // 4b) MALARIA reaching the LIVER hides INSIDE liver cells instead of damaging it
  if(g.flags.malaria){

      .forEach(iv=>{ iv.stage="blood";   // never reached the liver — it is merozoites in the blood now
        pushLog(g,`<b>${iv.disease}</b> is now circulating in the blood. Antibodies and the Monocyte can reach it.`,"bad"); });
    const embed=arrivals.filter(iv=>iv.type==="malaria" && (iv.stage==="liver"||iv.stage==="sporozoite") && iv.organ==="liver");

    });

  //     causes SLOW, CHRONIC damage for as long as it is left alive (this is what parasitic worms

  const wormLodge=arrivals.filter(iv=>iv.type==="worm");

    iv.lodged=true; iv.step=0; iv.wormClock=WORM_DAMAGE_EVERY;   // grace: first chronic bite is WORM_DAMAGE_EVERY turns away — no immediate damage
    const i=arrivals.indexOf(iv); if(i>=0) arrivals.splice(i,1);   // remove from the one-time-hit list
    const org=g.organs[iv.organ];
    if(org){ org.clear=0;
      pushLog(g,`<b>${iv.disease} has lodged in your ${ORGANS[iv.organ].name}.</b> A worm does not pass through — it settles in and feeds, chewing the organ a little more every few turns until you kill it. You have a short while before it starts to bite. Coat it, then the Eosinophil strikes — or Degranulates for the kill.`,"bad");
    }
  });
  if(wormLodge.length) snap("Worms lodge in the tissue");

  // 5) ORGAN DAMAGE
  arrivals.forEach(iv=>{ g.stats.gotThrough[tally(iv)]++;
    const org=g.organs[iv.organ]; if(!org) return;
    org.hp=Math.max(0,org.hp-1); org.clear=0; g.stats.organHits++;
    g.invaders=g.invaders.filter(x=>x.id!==iv.id);
    if(/Influenza/.test(iv.disease) && iv.organ==="lungs") g.rare.seen.fluInLungs=true;
    if(iv.amnesia && g.flags.specials && g.presentations>0){
      g.presentations=0;
      pushLog(g,`<b>IMMUNE AMNESIA.</b> Measles has wiped out your immune memory — every antigen you had learned is GONE. Antibody production drops back to the beginning. This really happens.`,"bad");
    }
    pushLog(g,`<b>${iv.disease}</b> infected the <b>${ORGANS[iv.organ].name}</b> — integrity ${org.hp}/${org.max}.`,"bad");
    if(org.hp===0 && !org.failed){ org.failed=true; g.stats.failures.push(iv.organ); }
  });
  if(arrivals.length) snap("Organ damage");

  // 6) LOSS — any organ failed
  const failed=g.organList.find(o=>g.organs[o].hp<=0);
  if(failed){ g.lost={organ:failed,turn:g.turn,disease:null};
    pushLog(g,`<b>${ORGANS[failed].name} failure.</b> The body has fallen.`,"bad"); snap("Organ failure"); return frames; }

  // 7) WIN / LOSS on the clearance model. No auto-win at turn N. After the onslaught window closes
  //    (turn > N) no new infections arrive, and you WIN only once the body is completely clear.
  //    Backstop: still not clear by turn N + GRACE_CLEAR = the immune system is exhausted, you LOSE.
  if(g.turn>g.maxTurn && g.everInfected){
    if(g.invaders.length===0){ g.won=true; pushLog(g,`Every infection faced and the body is completely clear — you win!`,"good"); snap("Victory"); return frames; }
    if(g.turn >= g.maxTurn + GRACE_CLEAR){ g.lost={organ:null,turn:g.turn,disease:null,reason:"attrition"};
      pushLog(g,`The body could not be cleared of infection in time — the immune system is exhausted. Defeat.`,"bad"); snap("Defeat"); return frames; }
  }

  // 8) end-of-turn upkeep
  if(kidneyLeak(g)){
    const pools=FAM_KEYS.concat(["X"]).filter(f=>(g.ab[f]||0)>0);
    if(pools.length){ const f=pools.sort((a,b)=>g.ab[b]-g.ab[a])[0]; g.ab[f]--;
      pushLog(g,`Damaged kidneys leaked a <b>${f}</b> antibody into the urine.`,"bad"); }
  }
  // organ convalescence — a branch cleared of invaders recovers.
  // On HARD, lost integrity is PERMANENT — an organ never regrows hit points. What DOES lift, after a
  // few clear turns, is the FUNCTIONAL penalty (the −1 AP, the antibody leak, etc.) as the tissue
  // compensates. On Normal/Training the organ can also regrow integrity, as before.
  const regrows = g.difficulty!=="hard";
  g.organList.forEach(o=>{ const org=g.organs[o];
    const dirty=g.invaders.some(iv=>iv.zone==="branch"&&iv.organ===o);
    if(dirty){ org.clear=0; org.compensated=false; return; }
    org.clear=(org.clear||0)+1;
    if(regrows && org.hp<org.max && org.clear>=HEAL_AFTER){
      org.hp++; org.clear=0;
      pushLog(g,`The <b>${ORGANS[o].name}</b> recovered — integrity ${org.hp}/${org.max}.`,"good");
    } else if(!regrows && org.hp<org.max && !org.compensated && org.clear>=HEAL_AFTER){
      org.compensated=true;   // the damage stays, but the body adapts around it
      pushLog(g,`The <b>${ORGANS[o].name}</b> is scarred (integrity stays ${org.hp}/${org.max}) but the body has <b>compensated</b> — its penalty no longer applies.`,"good");
    }
  });
  const next=g.turn+1;
  if(!g.cells.eosinophil.alive && next>=g.cells.eosinophil.regenAt){
    Object.assign(g.cells.eosinophil,{alive:true,regenAt:null,zone:"hub",lane:null,organ:null,step:0});
    pushLog(g,`<b>Eosinophil</b> regenerated — new granules loaded.`,"good");
  }
  if(!g.cells.neutrophil.alive && !marrowBroken(g) && next>=neutrophilReadyTurn(g)){
    Object.assign(g.cells.neutrophil,{alive:true,regenAt:null,zone:"hub",lane:null,organ:null,step:0});
    pushLog(g,`<b>Neutrophil</b> regenerated from the bone marrow.`,"good");
  }
  if(g.fx){
    if(g.suppress.neutrophil>0) g.suppress.neutrophil--;
    if(g.suppress.tcell>0) g.suppress.tcell--;
    if(g.fx.capTurns>0) g.fx.capTurns--;
    g.fx.noProduce=false; g.fx.apMod=0; g.fx.skipMarch=false;
  }
  checkRareTriggers(g);
  g.rare.killedThisTurn=0;
  g.turn=next; g.phase="infection"; g.drawn=null; g.drawnList=[]; g.cells.macrophage.freeEngulf=true;
  // A one-shot rare event (e.g. cytokine storm) already did its damage. Clear its banner after a
  // couple of turns so it does not linger implying an ongoing effect that has actually ended.
  if(g.rareBanner && g.rareBanner.firedTurn!=null && g.turn - g.rareBanner.firedTurn >= 2) g.rareBanner=null;
  g.cells.helper.usedThisTurn=false; g.free={}; g.wormsThisTurn=0;
  for(const o in g.residents){ g.residents[o].ate=false; }   // each resident may engulf once (free) per turn
  fireTurnStart(g);
  snap("Next turn");
  return frames;
}

function viewState(g){
  return { phase:g.phase, turn:g.turn, maxTurn:g.maxTurn, ap:g.ap, apMax:apFor(g), antibodies:g.antibodies,
    antibodyCap:capFor(g), cells:clone(g.cells), invaders:clone(g.invaders), organs:clone(g.organs),
    organList:g.organList.slice(), drawn:g.drawn?clone(g.drawn):null, deckCount:g.deck.length,
    residents:clone(g.residents), presentations:g.presentations, antibodyRate:rateFor(g),
    free:clone(g.free||{}), flags:clone(g.flags),
    multiplayer:g.multiplayer, players:(g.players||[]).slice(), captain:g.captain,
    owner:clone(g.owner||{}), apBudget:clone(g.apBudget||{}), apPool:g.apPool||0,
    banner:g.banner||null, warning:g.warning||null, suppress:clone(g.suppress||{}),
    rareBanner:g.rareBanner||null, antivenom:g.antivenom, rare:clone(g.rare||{}),
    avOrder:g.avOrder||0,
    ab:clone(g.ab||{}), made:clone(g.made||{}), memory:clone(g.memory||{}), vaccine:clone(g.vaccine||{}),
    seen:clone(g.seen||{}), clone:g.clone, cloneFound:g.cloneFound, novelSeen:g.novelSeen,
    undoDepth:(g.undo||[]).length,
    log:g.log.slice(0,40), difficulty:g.difficulty, won:g.won, lost:g.lost, science:g.science };
}

/* ---------------- reasonable-play bot + simulator ---------------- */
function simulate(difficulty,N,flags){
  let wins=0; const lossTurns=[], failOrgans={}, hits=[];
  let killTrunk=0, killBranch=0, cascade=0;
  for(let i=0;i<N;i++){
    const g=newGame({difficulty,science:false,flags});
    let guard=0;
    while(!g.won&&!g.lost&&guard++<200){
      applyAction(g,{action:"draw"}); applyAction(g,{action:"beginCommand"});
      let s=0;
      while(g.phase==="command"&&s++<60){
        const threats=[...g.invaders].sort((a,b)=>distToOrgan(g,a)-distToOrgan(g,b));
        const th=threats[0];
        // free engulf first (costs nothing)
        if(g.cells.macrophage.freeEngulf){ const e=macrophageEatable(g)[0]; if(e&&applyAction(g,{action:"engulf",cell:"macrophage",invaderId:e.id}).ok) continue; }
        // prime a resident if a germ is standing in its tissue (protects the organ)
        let primed=false;
        for(const o of g.organList){ const e=residentEatable(g,o)[0];
          if(e && applyAction(g,{action:"resengulf",organ:o,invaderId:e.id}).ok){ primed=true; break; } }
        if(primed) continue;
        if(!canAct(g,"nk") && g.ap<=0) break;
        // NK kills an infected cell up close (no antigen needed)
        const nk=nkTargets(g)[0]; if(nk && applyAction(g,{action:"nkkill",cell:"nk",invaderId:nk.id}).ok) continue;
        // Killer T snipes hidden viruses / liver malaria at range
        const sn=snipeTargets(g)[0]; if(sn && applyAction(g,{action:"snipe",cell:"tcell",invaderId:sn.id}).ok) continue;
        // memory: destroy a remembered pathogen for free/cheap
        const mem=g.invaders.find(iv=>iv.remembered && attackable(iv));
        if(mem && applyAction(g,{action:"memoryKill",invaderId:mem.id}).ok) continue;
        // Helper T-Cell: park it WITH the B-Cell (contact-dependent licensing)
        if(helperLicensed(g) && !samePlace(g.cells.helper,g.cells.bcell)){
          const hd=moveDestinations(g,"helper").map(d=>{ const pr={zone:d.zone,lane:d.lane||null,organ:d.organ||null,step:d.step||0};
            return {d,s:placeDist(g,pr,g.cells.bcell)}; }).sort((a,b)=>a.s-b.s);
          if(hd[0] && hd[0].s < placeDist(g,g.cells.helper,g.cells.bcell) && applyAction(g,{action:"move",cell:"helper",...hd[0].d}).ok) continue; }
        // novel antigen: go find the clone
        if(g.novelSeen && !g.cloneFound && g.invaders.some(x=>x.novel)
           && applyAction(g,{action:"clonalSelection"}).ok) continue;
        if(g.novelSeen && g.cloneFound && (g.ab.X||0)<1 && g.invaders.some(x=>x.novel)
           && applyAction(g,{action:"produce",cell:"bcell",family:"X"}).ok) continue;

        // ---- FOLLOW THROUGH: kill things that are already coated/reachable ----
        // a coated bacterium/parasite that a phagocyte is standing on -> engulf it
        {
          let done=false;
          for(const iv of g.invaders){
            if((iv.type==="bacteria"||iv.type==="parasite") && iv.tagged){
              // is a macrophage on it?
              if(samePlace(g.cells.macrophage,iv) && applyAction(g,{action:"engulf",cell:"macrophage",invaderId:iv.id}).ok){ done=true; break; }
            }
          }
          if(done) continue;
        }
        // a coated worm/parasite the eosinophil can reach -> strike (or degranulate a 3-HP worm about to hurt an organ)
        {
          const eo=g.cells.eosinophil;
          if(eo.alive){
            const hit=wormStrikeable(g,"eosinophil")[0];
            if(hit){
              // degranulate if it's a 3-HP worm lodged in / near an organ; else normal strike
              const urgent = hit.type==="worm" && hit.hp>=3 && (hit.zone==="branch"||hit.lodged);
              const act = urgent ? "degranulate" : "strike";
              if(applyAction(g,{action:act,cell:"eosinophil",invaderId:hit.id}).ok) continue;
            }
          }
        }

        // spend a MATCHING antibody on the most urgent threat (neutralise or tag)
        if(th){
          const tf=famOf(th);
          if((g.ab[tf]||0)>0){
            if((th.type==="virus"||th.type==="toxin"||th.type==="venom"||(th.type==="malaria"&&th.stage==="blood"))
               && applyAction(g,{action:"neutralise",invaderId:th.id}).ok) continue;
            if((th.type==="bacteria"||th.type==="worm"||th.type==="parasite") && !th.tagged
               && applyAction(g,{action:"tag",invaderId:th.id}).ok) continue;
          }
        }
        // produce antibodies against whichever class is most present
        {
          const need={};
          g.invaders.forEach(x=>{ if(x.type!=="hidden"&&!x.inMac) { const f=famOf(x); need[f]=(need[f]||0)+1; } });
          const want=Object.keys(need).sort((a,b)=>need[b]-need[a])
                     .find(f=>(g.ab[f]||0)<capFam(g,f) && (f!=="X" || g.cloneFound));
          if(want && applyAction(g,{action:"produce",cell:"bcell",family:want}).ok) continue;
        }
        // VACCINATE — on Normal/Hard this is the ONLY way to earn memory, so invest spare AP into it.
        // Prefer a disease already in the body (likely to recur), else any seen, not-yet-immune one.
        if(g.difficulty!=="training" && apNow(g)>0){
          const here=new Set(g.invaders.map(iv=>iv.disease));
          const cand=Object.keys(g.seen).filter(dz=>!g.memory[dz] && dz!=="Pathogen X")
                     .sort((a,b)=>(here.has(b)?1:0)-(here.has(a)?1:0));
          if(cand[0] && applyAction(g,{action:"vaccinate",disease:cand[0],ap:1}).ok) continue;
        }
        // NET a swarm
        const n=g.cells.neutrophil;
        if(n.alive && n.zone!=="hub" && invadersWith(g,n).length>=2 && applyAction(g,{action:"net",cell:"neutrophil"}).ok) continue;

        // ---- POSITIONING: move the right specialist toward the highest-value target ----
        // Priority: hidden virus (needs T/NK) > lodged worm (needs eosinophil) > coated bacterium/parasite (needs macrophage) > nearest threat
        {
          const hidden = g.invaders.filter(iv=> (iv.type==="hidden"||iv.inMac||(iv.type==="malaria"&&iv.stage==="liver")) && attackable(iv))
                          .sort((a,b)=>distToOrgan(g,a)-distToOrgan(g,b))[0];
          const worm = g.invaders.filter(iv=> (iv.type==="worm"||iv.type==="parasite") && iv.tagged)
                          .sort((a,b)=>distToOrgan(g,a)-distToOrgan(g,b))[0];
          const coated = g.invaders.filter(iv=> (iv.type==="bacteria"||iv.type==="parasite") && iv.tagged)
                          .sort((a,b)=>distToOrgan(g,a)-distToOrgan(g,b))[0];
          let moved=false;
          const goTo=(cell,target)=>{
            if(!target) return false;
            const c=g.cells[cell]; if(samePlace(c,target)) return false;
            const ds=moveDestinations(g,cell).map(d=>{ const pr={zone:d.zone,lane:d.lane||null,organ:d.organ||null,step:d.step||0};
              return {d,s:placeDist(g,pr,target)}; }).sort((a,b)=>a.s-b.s);
            if(ds[0] && ds[0].s < placeDist(g,c,target) && applyAction(g,{action:"move",cell,...ds[0].d}).ok) return true;
            return false;
          };
          // move Killer T (or NK) toward a hidden target it can't yet reach
          if(hidden && !snipeTargets(g).length){ if(goTo("tcell",hidden)){moved=true;} else if(goTo("nk",hidden)){moved=true;} }
          // move eosinophil toward a coated worm/parasite
          if(!moved && worm && !wormStrikeable(g,"eosinophil").length && g.cells.eosinophil.alive){ if(goTo("eosinophil",worm)) moved=true; }
          // move macrophage toward a coated bacterium/parasite to engulf
          if(!moved && coated){ if(goTo("macrophage",coated)) moved=true; }
          // otherwise move macrophage to the nearest threat
          if(!moved && th){ if(goTo("macrophage",th)) moved=true;
            else if(samePlace(g.cells.macrophage,th) && applyAction(g,{action:"engulf",cell:"macrophage",invaderId:th.id}).ok) moved=true; }
          if(moved) continue;
        }
        break;
      }
      applyAction(g,{action:"endCommand"});
    }
    killTrunk+=g.stats.killedTrunk; killBranch+=g.stats.killedBranch; hits.push(g.stats.organHits);
    if(g.won) wins++;
    else if(g.lost){ lossTurns.push(g.lost.turn); failOrgans[g.lost.organ]=(failOrgans[g.lost.organ]||0)+1;
      const dmg=g.organList.filter(o=>g.organs[o].hp<g.organs[o].max).length; if(dmg>=2) cascade++; }
  }
  const kt=killTrunk+killBranch;
  return { N, winRate:wins/N,
    avgLossTurn: lossTurns.length? lossTurns.reduce((a,b)=>a+b,0)/lossTurns.length : null,
    trunkKillPct: kt? killTrunk/kt : 0,
    avgOrganHits: hits.reduce((a,b)=>a+b,0)/N,
    cascadePct: lossTurns.length? cascade/lossTurns.length : 0,
    failOrgans };
}
/* crude distance between two places, for bot pathing */
function placeDist(g,a,b){
  const toHub=p=> p.zone==="hub"?0 : p.step;   // steps from p back to the hub
  if(a.zone===b.zone){
    if(a.zone==="hub") return 0;
    if(a.zone==="route"&&a.lane===b.lane) return Math.abs(a.step-b.step);
    if(a.zone==="branch"&&a.organ===b.organ) return Math.abs(a.step-b.step);
  }
  return toHub(a)+toHub(b);   // must go via the hub
}
</script>

const ROUTE={"nose":{"1":{"x":296,"y":374},"2":{"x":281,"y":333},"3":{"x":265,"y":291},"4":{"x":249,"y":250},"5":{"x":234,"y":209}},"gut":{"1":{"x":321,"y":559},"2":{"x":316,"y":605},"3":{"x":312,"y":651},"4":{"x":308,"y":696},"5":{"x":303,"y":742}},"contact":{"1":{"x":387,"y":528},"2":{"x":413,"y":558},"3":{"x":440,"y":589},"4":{"x":467,"y":620},"5":{"x":493,"y":651}},"wound":{"1":{"x":264,"y":511},"2":{"x":233,"y":534},"3":{"x":202,"y":557},"4":{"x":171,"y":580},"5":{"x":140,"y":603}},"bite":{"1":{"x":405,"y":442},"2":{"x":440,"y":432},"3":{"x":475,"y":422},"4":{"x":510,"y":413},"5":{"x":545,"y":403}},"blood":{"1":{"x":364,"y":374},"2":{"x":379,"y":333},"3":{"x":395,"y":291}}};

/* ===== REGION-FOCUS ZOOM =====

const REGIONS={"nose":{"cx":275,"cy":318,"scale":2.126},"gut":{"cx":314,"cy":622,"scale":1.967},

const REGION_BOX={"nose":{"x":172,"y":125,"w":206,"h":385},"gut":{"x":251,"y":414,"w":127,"h":416},
 "contact":{"x":282,"y":414,"w":283,"h":311},"wound":{"x":64,"y":414,"w":314,"h":257},
 "bite":{"x":282,"y":347,"w":342,"h":163},"blood":{"x":282,"y":207,"w":175,"h":303},
 "core":{"x":120,"y":158,"w":415,"h":549}};
const REGION_LABEL={nose:"Nose",gut:"Gut",contact:"Contact",wound:"Wound",bite:"Bite",blood:"Blood",core:"Core & Organs"};

function applyZoom(){
