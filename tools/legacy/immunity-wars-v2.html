/* ===== FOCUSED PANELS (Increments A+B+C) =====
   Tap a piece → the relevant surface rises over a dimmed board. Three surfaces:
   • route lane   : outside world (top) → 5 slots → hub (bottom)
   • organ branch : hub (top) → 2-4 slots → organ (bottom)
   • bloodstream  : hub + translucent arrows to all 13 paths, each with a threat summary
   Lymph hops appear as arrows-with-info at the step-3 crossing (same pattern as the bloodstream).
   Reuses the real engine: moveDestinations / act / btns / targetable. A new VIEW, not new logic. */
let lanePanel=null;   // {kind:"route"|"branch"|"hub", key, cell, view} — view=true means look-only (no actions)
/* A cell knocked offline by a crisis event (neutropenia / lymphopenia) cannot act at all —
   the engine already refuses, so the UI must not offer it either. (playtest 26-07, item 3) */
function cellOffline(ck){
  if(!U || !U.suppress) return null;
  if(ck==="neutrophil" && U.suppress.neutrophil>0)
    return "The Neutrophil is OFFLINE — neutropenia has crashed your neutrophil count. It cannot move, NET or act for "+U.suppress.neutrophil+" more turn(s).";
  if(ck==="tcell" && U.suppress.tcell>0)
    return "The Killer T-Cell is OFFLINE — lymphopenia has crashed your lymphocyte count. It cannot move or snipe for "+U.suppress.tcell+" more turn(s).";
  return null;
}
function openLanePanel(kind, key, cell, view){
  if(ROUTE_KEYS.includes(kind)){ view=cell; cell=key; key=kind; kind="route"; }
  lanePanel={kind, key, cell:cell||null, view:!!view, res:null};
  if(cell && !view){ const off=cellOffline(cell); if(off){ fl(off); } else sel={kind:"cell",key:cell,mode:null}; }
  renderLanePanel();
}
function openBranchPanel(organ, cell, view){ openLanePanel("branch", organ, cell, view); }
function openBloodstream(cell, view){ lanePanel={kind:"hub", key:null, cell:cell||null, view:!!view, arrowMode:false};
  if(cell && !view){ const off=cellOffline(cell); if(off){ fl(off); } else sel={kind:"cell",key:cell,mode:null}; } renderLanePanel(); }
function closeLanePanel(){ lanePanel=null; const o=document.getElementById("lanePanelOv"); if(o) o.remove();
  const b=document.querySelector(".bodyWrap"); if(b) b.classList.remove("dimmed"); }

function tokensAt(zone, key, step){
  const iv=U.invaders.filter(v=>{ if(v.zone!==zone||v.step!==step) return false;
    return zone==="route"?v.lane===key : zone==="branch"?v.organ===key : true; });
  const cells=CELL_KEYS.filter(ck=>{const c=U.cells[ck];
    if(c.zone!==zone||c.step!==step) return false;
    return zone==="route"?c.lane===key : zone==="branch"?c.organ===key : true; });
  return {iv, cells};
}
function canAfford(ck){ return U.ap>0 || (U.free && U.free[ck]>0); }

/* topmost tooltip shown AT the tap location (so you see why, right where you tapped) */
function tipAt(ev, msg){
  let t=document.getElementById("tapTip"); if(!t){ t=document.createElement("div"); t.id="tapTip"; document.body.appendChild(t); }
  t.className="tapTip"; t.textContent=msg;
  // position from the event (button/slot/token that was tapped)
  let x,y;
  const tgt=ev&&ev.currentTarget&&ev.currentTarget.getBoundingClientRect?ev.currentTarget.getBoundingClientRect():null;
  if(tgt){ x=tgt.left+tgt.width/2; y=tgt.top; } else if(ev&&ev.clientX){ x=ev.clientX; y=ev.clientY; } else { x=innerWidth/2; y=innerHeight/2; }
  t.style.left=Math.max(10,Math.min(innerWidth-10, x))+"px"; t.style.top=Math.max(10,y-8)+"px";
  requestAnimationFrame(()=>t.classList.add("show"));
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"), 4200);
}

/* ===== "EXPLAIN WHY" — never just grey-out; always say why (Not Yet / Not Here / Not Ever) ===== */
function whyCant(ck, action){
  const c=U.cells[ck];
  if(action!=="engulf" && !canAfford(ck)) return "No Action Points left this turn. End the turn to refresh them.";
  switch(action){
    case "move":
      if(ck==="bcell") return "The B-Cell is stationary — it sits in the lymph node making antibodies; it never moves.";
      if(ck==="neutrophil" && !c.alive) return "The Neutrophil is spent — regenerating in the marrow. It can't move yet.";
      if(ck==="eosinophil" && !c.alive) return "The Eosinophil is spent (it degranulated) and is regenerating.";
      if(c.zone==="branch" && c.organ==="brain")
        return "Inside the BRAIN every immune cell moves only 1 step per Action Point — even the fast ones. The blood–brain barrier keeps immune cells out, which is why the brain is so hard to defend (immune privilege).";
      if(!moveDestinations(U,ck).length) return "Nowhere to move from here right now.";
      return "";
    case "recall":
      if(ck==="bcell") return "The B-Cell doesn't patrol — it stays in the lymph node.";
      if(c.zone==="hub") return "Recall brings a cell back to the bloodstream — but it's already here.";
      return "";
    case "engulf":
      if(ck!=="macrophage") return "Only the Monocyte/Macrophage engulfs whole germs.";
      if(!macrophageEatable(U).length) return "Nothing here is small enough to engulf. Viruses hide inside cells; worms and parasites are too big — those need other tools.";
      if(!canAfford(ck) && !U.cells.macrophage.freeEngulf) return "No Action Points left (and no free engulf this turn).";
      return "";
    case "produce":
      if(U.fx && U.fx.noProduce) return "No antibodies can be made this turn (immunosuppression is blocking the B-Cell).";
      return "";
    case "produceX":
      if(!(U.novelSeen && U.cloneFound)) return "You must first find the matching clone with Clonal Selection before you can make Pathogen-X antibodies.";
      return "";
    case "clonalSelection":
      if(!U.novelSeen) return "Clonal selection is only needed for a brand-new antigen (Pathogen X) — none has appeared yet.";
      if(U.cloneFound) return "You've already found the Pathogen-X clone. Now just Produce its antibody.";
      return "";
    case "neutralise":
      if(!uiAnyNeutralisable()) return "Neutralise only works on a virus or toxin you ALREADY hold a matching antibody for. Either nothing here is a virus/toxin, or you haven't made the right antibody class yet.";
      return "";
    case "tag":
      if(!uiAnyTaggable()) return "Tag/Coat needs a bacterium (to tag) or a worm/parasite (to coat), AND a matching antibody in hand. You're missing one of those.";
      return "";
    case "snipe":
      if(!snipeTargets(U).length) return "The Killer T-Cell destroys INFECTED or HIDDEN cells within range. There's no hidden/infected target in range right now.";
      return "";
    case "strike":
      if(ck==="eosinophil" && !U.cells.eosinophil.alive) return "The Eosinophil is spent and regenerating.";
      if(!wormStrikeable(U,ck).length) return "Strike hits a COATED worm or parasite (too big to swallow). There's no worm/parasite in range, or it hasn't been coated with antibody yet.";
      return "";
    case "degranulate":
      if(ck!=="eosinophil") return "Only the Eosinophil degranulates.";
      if(!U.cells.eosinophil.alive) return "The Eosinophil is spent and regenerating.";
      if(!wormStrikeable(U,ck).length) return "Degranulate dumps toxic granules onto a coated worm/parasite — there's none in range.";
      return "";
    case "nk":
      if(!nkTargets(U).length) return "The NK cell kills stressed or infected cells on a d6 roll of 3+. No valid target in range now.";
      return "";
    case "net":
      if(c.zone==="hub") return "A Neutrophil can't cast a NET in the open bloodstream — it needs to be in a tissue lane with germs present.";
      if(!netTargets(U).length) return "A NET holds LIVING microbes on the Neutrophil's own slot. Toxins and venom are not alive, and worms and protozoa are far too big to hold — there is nothing here a NET can catch.";
      return "";
    case "antivenom":
      if(!antivenomTargets(U).length) return "Antivenom works on VENOM only — there is none in the body. (A toxin needs ANTITOXIN antibodies: use Neutralise.)";
      if(U.antivenom<=0) return "No antivenom in stock. Order some from the antibody panel first.";
      if(U.ap<3) return "Antivenom costs 3 Action Points — you don't have 3 right now.";
      return "";
  }
  return "";
}
function explainAction(ck, action){ const w=whyCant(ck,action); panelSay(w||"That action isn't available right now."); }

/* ===== B-CELL PRODUCE: class-picker overlay (Option A) =====
   Produce doesn't target a place — it makes antibodies of a chosen ANTIGEN CLASS.
   So it opens a picker of the 6 classes (+ Pathogen X once its clone is found), right in the panel. */
function openProducePicker(){
  let ov=document.getElementById("producePickerOv");
  if(!ov){ ov=document.createElement("div"); ov.id="producePickerOv"; ov.className="lanePanelOv producePicker"; document.body.appendChild(ov); }
  const canX = U.cloneFound && (U.invaders||[]).some(iv=>iv.novel);   // X antibodies only while an X threat is in the body
  const classes=[...FAM_KEYS, ...(canX?["X"]:[])];
  const cards=classes.map(f=>{
    const fam = f==="X" ? {name:"Pathogen X (new)", short:"X", col:"#f0abfc", bio:"The brand-new antigen you found by clonal selection. Make its custom antibody."} : FAMILIES[f];
    const have=U.ab[f]||0, cap=capFam(U,f), full=have>=cap;
    const pb=productionBreakdown(U,f); const rate=pb.net;
    const cue = pb.boosted?' ▲':(pb.reduced?' ▼':'');
    return `<button class="pcCard ${full?'full':''}" ${full?'':`data-fam="${f}"`} style="--fc:${fam.col}">
      <div class="pcHead"><span class="pcTag" style="background:${fam.col}">${fam.short}</span><span class="pcName">${fam.name}</span></div>
      <div class="pcBio">${fam.bio}</div>
      <div class="pcFoot"><span class="pcStore">Stock: <b>${have}/${cap}</b></span>
        <span class="pcRate ${pb.boosted?'up':''}${pb.reduced?'dn':''}">${full?'FULL':`+${rate}/action${cue}`}</span></div>
    </button>`;
  }).join("");
  ov.innerHTML=`
    <div class="lpBar"><button class="zBtn" onclick="closeProducePicker()">← Back</button>
      <span class="zTitle" style="border-color:var(--antibody);color:var(--antibody)">B-Cell · make antibodies</span>${apBadge()}</div>
    <div class="pcIntro">Antibodies are <b>specific</b> — pick the antigen class to make them against. Each matches certain pathogens.</div>
    <div class="pcGrid">${cards}</div>`;
  ov.querySelectorAll(".pcCard[data-fam]").forEach(el=>{ el.onclick=()=>{
    const f=el.dataset.fam; act({action:"produce",cell:"bcell",family:f});
    // stay in the picker so you can see the stock rise / make more if AP remains
    if(canAfford("bcell")) openProducePicker(); else closeProducePicker();
  }; });
}
function closeProducePicker(){ const o=document.getElementById("producePickerOv"); if(o) o.remove(); }
// show an explanation INSIDE the panel (guaranteed visible), plus the global flash
function panelSay(msg){
  fl(msg);
  const ov=document.getElementById("lanePanelOv"); if(!ov) return;
  let b=ov.querySelector(".lpWhy"); if(!b){ b=document.createElement("div"); b.className="lpWhy"; ov.appendChild(b); }
  b.textContent=msg; b.classList.add("show");
  clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove("show"), 4200);
}
// wrap btns() so DISABLED buttons still explain themselves when tapped (mobile-friendly "why not")
/* ---- clean panel action bar (no fragile regex) ---- */
function actionList(ck){
  const c=U.cells[ck]; const aff=canAfford(ck); const L=[];
  if(ck!=="bcell"){
    L.push({a:"move", label:(lanePanel&&lanePanel.kind==="hub")?"Move ▸":"Move", on: aff && moveDestinations(U,ck).length>0, pri:sel.mode==="move"});
    L.push({a:"recall", label:"Recall", on: aff && c.zone!=="hub"});
  }
  if(ck==="macrophage"){ const can=macrophageEatable(U).length>0, f=U.cells.macrophage.freeEngulf;
    L.push({a:"engulf", label:"Engulf"+(f?" (free)":""), on: can && (f||aff), pri:sel.mode==="engulf"}); }
  if(ck==="bcell"){
    const xHere = (U.invaders||[]).some(iv=>iv.novel);
    if(xHere && !U.cloneFound) L.push({a:"clonalSelection", label:"🔍 Clonal selection", on: aff});
    if(xHere && U.cloneFound && (U.ab.X||0)<=0) L.push({a:"produceX", label:"✚ Produce X", on: aff});
    L.push({a:"produce", label:"Produce ▾", on: aff && !(U.fx&&U.fx.noProduce)});
    L.push({a:"neutralise", label:"Neutralise", on: aff && uiAnyNeutralisable(), pri:sel.mode==="neutralise"});
    L.push({a:"tag", label:"Tag / Coat", on: aff && uiAnyTaggable(), pri:sel.mode==="tag"});
    L.push({a:"antivenom", label:"Antivenom (3AP·"+U.antivenom+")", on: antivenomTargets(U).length>0 && U.antivenom>0 && U.ap>=3, pri:sel.mode==="antivenom"});
  }
  if(ck==="tcell"){ const s=snipeTargets(U).length; L.push({a:"snipe", label:"Snipe"+(s?" ("+s+")":""), on: aff && s>0, pri:sel.mode==="snipe"}); }
  if(["macrophage","eosinophil"].includes(ck)){
    const w=wormStrikeable(U,ck).length, eoDead=ck==="eosinophil"&&!U.cells.eosinophil.alive;
    L.push({a:"strike", label:"Strike "+(ck==="eosinophil"?"(2 dmg)":"(1 dmg)"), on: aff && w>0 && !eoDead, pri:sel.mode==="strike"});
    if(ck==="eosinophil") L.push({a:"degranulate", label:"Degranulate (2 AP · 3 dmg)💥", on: U.ap>=2 && w>0 && !eoDead, pri:sel.mode==="degranulate"});
  }
  if(ck==="nk") L.push({a:"nk", label:"Kill (d6 3+)", on: aff && nkTargets(U).length>0, pri:sel.mode==="nk"});
  if(ck==="neutrophil"){ const here=netTargets(U).length;
    L.push({a:"net", label:"NET"+(here?" ("+here+")":""), on: aff && c.alive && c.zone!=="hub" && here>0}); }
  return L;
}
function panelActionBar(ck){
  return actionList(ck).map(it=>
    `<button class="bt sm ${it.pri?'pri':''} ${it.on?'':'off'}" data-act="${it.a}" data-ck="${ck}">${it.label}</button>`
  ).join("");
}
function wirePanelActions(ov, ck){
  ov.querySelectorAll(".lpActsBtns .bt").forEach(el=>{ el.onclick=(ev)=>{ ev.stopPropagation();
    const a=el.dataset.act;
    const item=actionList(ck).find(x=>x.a===a);
    if(!item || !item.on){ tipAt(ev, whyCant(ck,a) || "Not available right now."); return; }
    if(a==="move"){ if(lanePanel.kind==="hub"){ lanePanel.arrowMode=true; sel.mode="move"; renderLanePanel(); } else { sel.mode=(sel.mode==="move"?null:"move"); renderLanePanel(); } return; }
    if(a==="produce"){ openProducePicker(); return; }
    if(a==="produceX"){ act({action:"produce",cell:"bcell",family:"X"}); return; }
    if(a==="clonalSelection"){ act({action:"clonalSelection"}); return; }
    if(a==="recall"){ act({action:"recall",cell:ck}); return; }
    if(a==="net"){ act({action:"net",cell:"neutrophil"}); return; }
    sel.mode=(sel.mode===a?null:a); renderLanePanel();
  }; });
}
/* resident macrophage: you control it. Move (±1 step, 1 AP each) or Engulf a germ where it stands (free, once/turn). */
function residentActionBar(o){
  const r=U.residents[o]; const aff=U.ap>0;
  const eat = residentEatable(U,o).length>0;
  const canMove = U.flags.residentMove && !r.infectedBy;
  const btns=[
    {a:"resmove", label:"Move (1 AP)", on: aff && canMove, pri:sel.mode==="resmove"},
    {a:"resengulf", label: r.ate?"Engulf ✓ done":"Engulf (free)", on: eat && !r.ate && !r.infectedBy, pri:false},
  ];
  return btns.map(it=>`<button class="bt sm ${it.pri?'pri':''} ${it.on?'':'off'}" data-resact="${it.a}" data-org="${o}">${it.label}</button>`).join("");
}
function wireResidentActions(ov, o){
  ov.querySelectorAll(".lpActsBtns .bt").forEach(el=>{ el.onclick=(ev)=>{ ev.stopPropagation();
    const a=el.dataset.resact; const r=U.residents[o];
    if(a==="resmove"){
      if(r.infectedBy){ tipAt(ev,"This resident is infected — a parasite is hiding inside it. Kill the parasite to free it."); return; }
      if(!U.flags.residentMove){ tipAt(ev,"Residents can't move in this scenario."); return; }
      if(U.ap<=0){ tipAt(ev,"No Action Points left this turn."); return; }
      sel.mode=(sel.mode==="resmove"?null:"resmove"); renderLanePanel(); return;
    }
    if(a==="resengulf"){
      if(r.infectedBy){ tipAt(ev,"A parasite is hiding inside this resident — kill it first."); return; }
      if(r.ate){ tipAt(ev,"This resident has already engulfed this turn."); return; }
      const eat=residentEatable(U,o);
      if(!eat.length){ tipAt(ev,"Nothing here this resident can engulf. Move it onto a virus or a tagged bacterium in its own organ."); return; }
      act({action:"resengulf",organ:o,invaderId:eat[0].id}); return;
    }
  }; });
}
// why a particular tap-target is invalid, given the current mode
function whyNotTarget(mode, iv){
  if(mode==="move") return "Too far — a cell moves only up to its speed per Action Point. Move to a highlighted slot, stepping closer each turn.";
  if(mode==="neutralise") return "Neutralise needs a virus or toxin you hold a matching antibody for. "+ (iv?("This is "+(iv.type)+"."):"");
  if(mode==="engulf") return "Too big or hidden to engulf. Viruses inside cells need the Killer T-Cell; worms/parasites need Strike.";
  if(mode==="snipe") return "Snipe only destroys infected or hidden cells, and only within range.";
  if(mode==="strike") return "Strike only hits a coated worm or parasite. Coat it first with a B-Cell antibody.";
  return "That isn't a valid target for this action.";
}
function laneMoveDests(){ if(!lanePanel||!lanePanel.cell||sel.mode!=="move") return [];
  if(!canAfford(lanePanel.cell)) return [];   // no AP (and no free move) → nothing is reachable
  return moveDestinations(U, lanePanel.cell); }

// count threats on a path, for the bloodstream arrow summaries
function pathThreat(zone, key){
  const iv=U.invaders.filter(v=> v.zone===zone && (zone==="route"?v.lane===key:v.organ===key));
  if(!iv.length) return {n:0, txt:"clear", cls:"clear"};
  // nearest-to-target step + dominant type
  const types={}; iv.forEach(v=>types[v.type]=(types[v.type]||0)+1);
  const dom=Object.keys(types).sort((a,b)=>types[b]-types[a])[0];
  const near = zone==="route" ? Math.min(...iv.map(v=>v.step))   // route: low step = near hub/organ
                              : Math.min(...iv.map(v=>v.step));
  return {n:iv.length, txt:`${(UI_[dom]||{g:'?'}).g}×${iv.length}`, cls:"threat", near};
}

function renderLanePanel(){
  if(!lanePanel) return;
  const dimBoard=document.querySelector(".bodyWrap"); if(dimBoard) dimBoard.classList.add("dimmed");
  let ov=document.getElementById("lanePanelOv");
  if(!ov){ ov=document.createElement("div"); ov.id="lanePanelOv"; ov.className="lanePanelOv"; document.body.appendChild(ov); }

  if(lanePanel.kind==="hub"){ renderBloodstream(ov); return; }

  // ---- linear panel: route lane or organ branch ----
  const isBranch = lanePanel.kind==="branch";
  const key=lanePanel.key;
  const L = isBranch ? branchLen(key) : ROUTES[key].len;
  const col = isBranch ? (getComputedStyle(document.documentElement).getPropertyValue("--o-"+key).trim()||"#8a7186")
                       : (RGCOL[RGROUP[key]]||"#8a7186");
  const title = isBranch ? ORGANS[key].name+" branch" : ROUTES[key].name+" lane";
  const dests=laneMoveDests();
  const isDest=(zone,k,step)=>dests.some(d=>d.zone===zone&&(d.lane||d.organ||null)===(k||null)&&(d.step||0)===(step||0));

  const rows=[];
  // TOP cap
  if(isBranch) rows.push(`<div class="lpEntry" style="color:#e6394b;border-color:#e6394b">♥ from the bloodstream</div>`);
  else rows.push(`<div class="lpEntry" style="color:${col};border-color:${col}">▲ ${ROUTES[key].name} — outside world</div>`);

  // step nodes along the vessel. route: step L (top) .. 1 (bottom). branch: step L (top, near hub) .. 1 (bottom, near organ)
  for(let s=L;s>=1;s--){
    const {iv,cells}=tokensAt(lanePanel.kind, key, s);
    const lymph = !isBranch && s===LYMPH_STEP && RGROUP[key]!=="blood";
    const dest = isDest(lanePanel.kind, key, s);
    const toks = iv.map(v=>pathIcon(v, (!lanePanel.view&&targetable(v))?'tg':'', `data-iv="${v.id}"`)).join("");
    let myc = cells.map(ck=>cellIcon(ck, (ck===lanePanel.cell?'me':''), `data-cell="${ck}"`)).join("");
    // resident macrophage: patrols THIS organ's branch — show it on its step, selectable
    if(isBranch){ const r=U.residents[key]; if(r && r.step===s) myc+=residentIcon(key); }
    const node = (toks||myc) ? `${toks}${myc}` : `<span class="lpDot"></span>`;
    // a resident selected & in move mode makes ±1 branch steps its destinations
    const resDest = isBranch && lanePanel.res===key && sel.mode==="resmove" && Math.abs(s-U.residents[key].step)===1;
    rows.push(`<div class="lpStep ${dest||resDest?'dest':''} ${lymph?'lymph':''}" data-zone="${lanePanel.kind}" data-key="${key}" data-step="${s}" data-resdest="${resDest?1:0}" style="--lc:${col}">
        <div class="lpConn"></div>
        <div class="lpStepNum">${s}${lymph?'<span class="ly">lymph ⇄</span>':''}</div>
        <div class="lpNode">${node}</div>
        ${dest||resDest?'<div class="lpGoSide">tap to move ↤</div>':'<div></div>'}
      </div>`);
  }

  // BOTTOM cap
  if(isBranch){
    const {iv}=tokensAt("branch", key, 0);
    const dest=isDest("branch",key,0);
    const resDest0 = lanePanel.res===key && sel.mode==="resmove" && Math.abs(0-U.residents[key].step)===1;
    const toks=iv.map(v=>pathIcon(v, (!lanePanel.view&&targetable(v))?'tg':'', `data-iv="${v.id}"`)).join("");
    const r=U.residents[key]; const resTok=r&&r.step===0?residentIcon(key):"";
    const hp=U.organs[key]; const hpbar=Array.from({length:hp.max}).map((_,k)=>`<i class="${k<hp.hp?'':'x'}"></i>`).join("");
    rows.push(`<div class="lpEndcap lpOrgan ${dest||resDest0?'dest':''}" data-zone="branch" data-key="${key}" data-step="0" data-resdest="${resDest0?1:0}" style="--oc:var(--o-${key})">
        <div class="lpConn"></div>
        <div class="lpOrganArt" style="border-color:var(--o-${key})">${organIcon(key)}</div>
        <div class="lpOrganName">${ORGANS[key].name}</div>
        <div class="lpOrganHp" title="Organ health">${hpbar}</div>
        ${(toks||resTok)?`<div class="organOccupantsRow">${toks}${resTok}</div>`:''}
        ${dest||resDest0?'<div class="lpCapLabel" style="color:var(--o-'+key+')">tap to move here</div>':''}
      </div>`);
  } else {
    const hubDest=isDest("hub",null,0);
    rows.push(`<div class="lpEndcap ${hubDest?'dest':''}" data-zone="hub" data-step="0">
        <div class="lpConn"></div>
        <div class="lpHubGlyph">♥</div>
        <div class="lpCapLabel">Bloodstream${hubDest?' · tap to move here':''}</div>
        <button class="lpHubGo" onclick="openBloodstream(lanePanel.cell)">open bloodstream ▸</button></div>`);
  }

  // lymph destinations leading to a PAIRED lane (navigation, since they're not on this lane)
  let lymphNav="";
  if(!isBranch && !lanePanel.view && lanePanel.cell && sel.mode==="move"){
    const otherLanes=[...new Set(dests.filter(d=>d.lymph && d.lane!==key).map(d=>d.lane))];
    if(otherLanes.length){
      lymphNav=`<div class="lpLymphNav"><div class="lpLymphLbl">⇄ Lymphatic crossing — continue into a connected lane:</div>${
        otherLanes.map(to=>{ const th=pathThreat("route",to);
          return `<button class="lpHop" data-lymphlane="${to}">${ROUTES[to].name}<i>${th.txt}</i></button>`; }).join("")}</div>`;
    }
  }

  const actionBar = (lanePanel.res && !lanePanel.view)
    ? `<div class="lpActs"><div class="lpActsCell"><span class="lpActsGlyph" style="background:var(--o-${lanePanel.res})">🛡</span>${RESIDENT_NAME[lanePanel.res]||"Resident macrophage"} · patrols the ${ORGANS[lanePanel.res].name}</div><div class="lpActsBtns">${residentActionBar(lanePanel.res)}</div></div>`
    : (lanePanel.cell && !lanePanel.view)
    ? `<div class="lpActs">${lymphNav}<div class="lpActsCell"><span class="lpActsGlyph" style="background:var(--c-${lanePanel.cell})">${UM[lanePanel.cell].g}</span>${UM[lanePanel.cell].n}${lanePanel.cell!=="bcell"?' · speed '+SPEED[lanePanel.cell]:''}</div><div class="lpActsBtns">${panelActionBar(lanePanel.cell)}</div></div>`
    : `<div class="lpActs"><div class="lpHint">👁 Viewing ${title}. Tap a cell or resident to act here.</div></div>`;

  ov.innerHTML=`
    <div class="lpBar"><button class="zBtn" onclick="closeLanePanel()">← Body</button>
      <span class="zTitle" style="border-color:${col};color:${col}">${title}</span>${apBadge()}</div>
    <div class="lpLane">${rows.join("")}</div>
    ${actionBar}`;
  wireLinearPanel(ov, key);
}
// AP badge shown in every panel's top bar
function apBadge(){ const n=U.ap; return `<span class="lpAP ${n<=0?'empty':''}"><span class="apDot"></span>${n} AP</span>`; }
/* art icons: real pictures for cells/pathogens/organs, with the identifying colour as a ring/bg */
function cellIcon(ck, cls, attr){ const src=(typeof ART!=="undefined")&&ART.cell[ck];
  return src ? `<span class="artIcon ${cls||''}" style="--ring:var(--c-${ck})" ${attr||''}><img src="${src}" alt="${UM[ck].n}"/></span>`
             : `<span class="lpCell ${cls||''}" style="background:var(--c-${ck})" ${attr||''}>${UM[ck].g}</span>`; }
function pathArt(o){ if(typeof ART==="undefined"||!ART.path) return null;
  return (o && o.novel && ART.path.novel) ? ART.path.novel : ART.path[o&&o.type];  }
function pathIcon(iv, cls, attr){ const t=iv.type; const src=pathArt(iv);
  const hp=(iv.maxhp||1)>1?`<i class="lpHp">${iv.hp}/${iv.maxhp}</i>`:"";
  return src ? `<span class="artIcon path ${cls||''}" style="--ring:${(UI_[t]||{c:'#f66'}).c}" ${attr||''}><img src="${src}" alt="${(UI_[t]||{n:'?'}).n}"/>${hp}</span>`
             : `<span class="lpTok ${t} ${cls||''}" ${attr||''}>${(UI_[t]||{g:'?'}).g}${hp}</span>`; }
function organIcon(o){ const src=(typeof ART!=="undefined")&&ART.organ[o];
  return src ? `<img class="organImg" src="${src}" alt="${ORGANS[o].name}"/>` : ((RGLYPH&&RGLYPH[o])||'●'); }
// resident macrophage: a tissue macrophage that patrols one organ. Uses macrophage art, organ-coloured ring.
function residentIcon(o){ const src=(typeof ART!=="undefined")&&ART.cell.macrophage;
  const sel_=(lanePanel&&lanePanel.res===o)?'me':'';
  return src ? `<span class="artIcon resident ${sel_}" style="--ring:var(--o-${o})" data-res="${o}" title="Resident macrophage (${ORGANS[o].name})"><img src="${src}" alt="resident"/></span>`
             : `<span class="lpCell ${sel_}" style="background:var(--o-${o})" data-res="${o}">🛡</span>`; }

function wireLinearPanel(ov, key){
  const viewOnly=lanePanel.view;
  if(!viewOnly && lanePanel.res) wireResidentActions(ov, lanePanel.res);
  else if(!viewOnly && lanePanel.cell) wirePanelActions(ov, lanePanel.cell);
  if(!viewOnly){
    // normal cell move destinations
    ov.querySelectorAll(".lpStep.dest, .lpEndcap.dest").forEach(el=>{
      el.onclick=(e)=>{ if(e.target.closest(".lpTok, .lpCell, .artIcon, .lpHubGo")) return;
        const zone=el.dataset.zone, step=+el.dataset.step;
        // resident move?
        if(el.dataset.resdest==="1" && lanePanel.res){ act({action:"resmove",organ:lanePanel.res,step}); return; }
        if(zone==="hub") act({action:"move",cell:lanePanel.cell,zone:"hub",step:0});
        else act({action:"move",cell:lanePanel.cell,zone,lane:zone==="route"?key:null,organ:zone==="branch"?key:null,step});
      };
    });
    if(sel.mode==="move"){
      ov.querySelectorAll(".lpStep:not(.dest)").forEach(el=>{ el.onclick=(e)=>{ if(e.target.closest(".lpTok,.lpCell,.artIcon")) return;
        e.stopPropagation(); tipAt(e, whyNotTarget("move")); }; });
    }
    ov.querySelectorAll(".lpHop[data-lymphlane]").forEach(el=>{ el.onclick=(e)=>{e.stopPropagation();
      const to=el.dataset.lymphlane; openLanePanel("route", to, lanePanel.cell); sel.mode="move"; renderLanePanel(); }; });
  }
  // tapping a RESIDENT selects it (branch panels only)
  ov.querySelectorAll("[data-res]").forEach(el=>{ el.onclick=(e)=>{e.stopPropagation();
    const o=el.dataset.res;
    if(viewOnly){ tipAt(e,"Resident macrophage — patrols the "+ORGANS[o].name+". Open this organ from the body to command it."); return; }
    lanePanel.res=(lanePanel.res===o?null:o); lanePanel.cell=null; sel.mode=null; renderLanePanel(); }; });
  ov.querySelectorAll("[data-cell]").forEach(el=>{ el.onclick=(e)=>{e.stopPropagation();
    const ck=el.dataset.cell; if(ck && ck!==lanePanel.cell) tipAt(e, UM[ck].n+" — exit and tap this cell on the body to control it."); }; });
  ov.querySelectorAll("[data-iv]").forEach(el=>{ const iv=U.invaders.find(v=>v.id===el.dataset.iv); if(!iv) return;
    el.onclick=(e)=>{e.stopPropagation();
      if(!viewOnly && sel.mode && sel.mode!=="move"){
        if(targetable(iv)) hit(iv);
        else panelSay(whyNotTarget(sel.mode, iv));      // explain why this pathogen isn't a valid target
      } else { openCard=iv.disease; const tr=TROPISM[iv.disease]; const w=tr==="any"?"any organ":(tr||[]).map(o=>ORGANS[o].name).join(" or ");
        fl(iv.disease+" → targets "+w+". "+(FACT[iv.disease]||"")); } }; });
}

// ---- BLOODSTREAM (hub) VIEW ----
function renderBloodstream(ov){
  const cell=lanePanel.cell; const viewOnly=lanePanel.view;
  // arrowMode = the cell chose Move from the bloodstream → show the 13 arrows to pick a direction
  const arrowMode = !viewOnly && cell && lanePanel.arrowMode;

  const {iv}=tokensAt("hub",null,0);
  const hubToks=iv.map(v=>pathIcon(v, (!viewOnly&&targetable(v))?'tg':'', `data-iv="${v.id}"`)).join("");
  const hubCells=CELL_KEYS.filter(ck=>U.cells[ck].zone==="hub").map(ck=>cellIcon(ck, (ck===cell?'me':''), `data-cell="${ck}"`)).join("");

  let body;
  if(arrowMode){
    // show every front as an arrow with a threat summary; tap → open that lane in move-mode
    const dests=moveDestinations(U,cell);
    const canReach=(zone,k)=>dests.some(d=>d.zone===zone&&(d.lane||d.organ)===k);
    const laneArrows=ROUTE_KEYS.map(l=>{ const th=pathThreat("route",l); const reach=canReach("route",l);
      return `<button class="lpArrow ${th.cls} ${reach?'reach':'noreach'}" ${reach?'':'disabled'} data-kind="route" data-key="${l}">
        <span class="laName">${ROUTES[l].name}</span><span class="laInfo ${th.cls}">${th.txt}</span></button>`; }).join("");
    const branchArrows=U.organList.map(o=>{ const th=pathThreat("branch",o); const reach=canReach("branch",o);
      return `<button class="lpArrow ${th.cls} ${reach?'reach':'noreach'}" ${reach?'':'disabled'} data-kind="branch" data-key="${o}">
        <span class="laName">${ORGANS[o].name}</span><span class="laInfo ${th.cls}">${th.txt}</span></button>`; }).join("");
    body=`<div class="lpArrowGroup"><div class="lpGroupLbl">↑ Entry lanes</div><div class="lpArrows">${laneArrows}</div></div>
      <div class="lpHubBig"><div class="lpHubGlyph big">♥</div><div class="lpArrowNote">Pick a direction — then tap the exact slot to move.</div></div>
      <div class="lpArrowGroup"><div class="lpGroupLbl">↓ Organ branches</div><div class="lpArrows">${branchArrows}</div></div>`;
  } else {
    // normal hub view: hub contents + (if acting) a note that Move opens the arrows
    body=`<div class="lpArrowGroup"><div class="lpGroupLbl">↑ Entry lanes (infection comes in)</div><div class="lpArrows">${
      ROUTE_KEYS.map(l=>{const th=pathThreat("route",l);return `<button class="lpArrow ${th.cls} viewonly" data-view="route" data-key="${l}"><span class="laName">${ROUTES[l].name}</span><span class="laInfo ${th.cls}">${th.txt}</span></button>`;}).join("")}</div></div>
      <div class="lpHubBig"><div class="lpHubGlyph big">♥</div><div class="lpSlotBody" style="justify-content:center">${hubToks}${hubCells}</div></div>
      <div class="lpArrowGroup"><div class="lpGroupLbl">↓ Organ branches (deeper in)</div><div class="lpArrows">${
      U.organList.map(o=>{const th=pathThreat("branch",o);return `<button class="lpArrow ${th.cls} viewonly" data-view="branch" data-key="${o}"><span class="laName">${ORGANS[o].name}</span><span class="laInfo ${th.cls}">${th.txt}</span></button>`;}).join("")}</div></div>`;
  }

  // action bar
  let actionBar;
  if(viewOnly || !cell){
    actionBar=`<div class="lpActs"><div class="lpHint">👁 Viewing the bloodstream. Tap a cell on the body to act here.</div></div>`;
  } else if(arrowMode){
    actionBar=`<div class="lpActs"><button class="zBtn" onclick="lanePanel.arrowMode=false;renderLanePanel()">← Back</button><div class="lpHint" style="flex:1">Choose a front for ${UM[cell].n} to move toward.</div></div>`;
  } else {
    // hub actions: Move (in actionList) switches to the arrow chooser via wirePanelActions
    actionBar=`<div class="lpActs"><div class="lpActsCell"><span class="lpActsGlyph" style="background:var(--c-${cell})">${UM[cell].g}</span>${UM[cell].n} · bloodstream</div>
      <div class="lpActsBtns">${panelActionBar(cell)}</div></div>`;
  }

  const backBtn = arrowMode ? "" : `<button class="zBtn" onclick="closeLanePanel()">← Body</button>`;
  ov.innerHTML=`
    <div class="lpBar">${backBtn}<span class="zTitle" style="border-color:#e6394b;color:#fb7185">Bloodstream${arrowMode?' — pick a front':' — all fronts'}</span>${apBadge()}</div>
    <div class="lpBlood">${body}</div>
    ${actionBar}`;

  // wiring
  if(!viewOnly && cell && !arrowMode) wirePanelActions(ov, cell);
  if(arrowMode){
    ov.querySelectorAll(".lpArrow.reach").forEach(el=>{ el.onclick=()=>{
      const kind=el.dataset.kind, k=el.dataset.key;
      if(kind==="route") openLanePanel("route",k,cell); else openBranchPanel(k,cell);
      sel.mode="move"; renderLanePanel();
    }; });
    ov.querySelectorAll(".lpArrow.noreach").forEach(el=>{ el.onclick=(e)=>{
      tipAt(e, "Too far to reach in one move. Get closer, or you have no Action Points left."); }; });
  } else {
    ov.querySelectorAll(".lpArrow.viewonly").forEach(el=>{ el.onclick=()=>{
      const k=el.dataset.key; if(el.dataset.view==="route") openLanePanel("route",k,null,true); else openBranchPanel(k,null,true); }; });
  }
  ov.querySelectorAll("[data-cell]").forEach(el=>{ el.onclick=(e)=>{e.stopPropagation();
    const ck=el.dataset.cell; if(ck && ck!==cell) tipAt(e, UM[ck].n+" — exit and tap this cell on the body to control it."); }; });
  ov.querySelectorAll("[data-iv]").forEach(el=>{ const iv=U.invaders.find(v=>v.id===el.dataset.iv); if(!iv) return;
    el.onclick=(e)=>{e.stopPropagation();
      if(!viewOnly&&sel.mode&&sel.mode!=="move"){ if(targetable(iv)) hit(iv); else tipAt(e, whyNotTarget(sel.mode, iv)); }
      else { openCard=iv.disease; fl(iv.disease+" — "+(FACT[iv.disease]||"")); } }; });
}
function renderZoomChrome(){
  const wrap=document.querySelector(".bodyWrap"); if(!wrap) return;
  // remove old chrome
  wrap.querySelectorAll(".zoomBar,.regionHot,.overviewHint").forEach(e=>e.remove());
  if(viewMode==="overview"){
    // region hotspots (tappable) over each region + hint
    const inner=document.getElementById("bodyInner");
    Object.keys(REGION_BOX).forEach(k=>{
      const b=REGION_BOX[k]; const h=document.createElement("div"); h.className="regionHot";
      h.style.left=(b.x+b.w/2)/VW*100+"%"; h.style.top=(b.y+b.h/2)/VH*100+"%";
      h.style.width=b.w/VW*100+"%"; h.style.height=b.h/VH*100+"%";
      h.innerHTML=`<span class="rlab">${REGION_LABEL[k]}</span>`;
      h.onclick=(e)=>{e.stopPropagation();focusRegion(k);};
      wrap.appendChild(h);
    });
    const hint=document.createElement("div"); hint.className="overviewHint";
    hint.textContent="Tap a region to zoom in and play";
    wrap.appendChild(hint);
  } else {
    const bar=document.createElement("div"); bar.className="zoomBar";
    bar.innerHTML=`<button class="zBtn" onclick="toOverview()">⤢ Overview</button><span class="zTitle">${REGION_LABEL[viewMode]}</span>`;
    wrap.appendChild(bar);
  }
}

// A "hidden"-type card hides INSIDE a cell — but that can be a virus OR an intracellular protozoan.
// Name it by its true antigen class so a EUK parasite is never mislabelled a virus (#5).
function typeName(dzOrIv){
  const iv = typeof dzOrIv==="string" ? {type:"hidden",disease:dzOrIv} : dzOrIv;
  if(iv.type==="hidden"){
    const f = (typeof FAMILY!=="undefined" && FAMILY[iv.disease]) || "ENV";
    if(f==="EUK") return "Hidden parasite (hides in a cell)";
    return "Hidden virus (hides in a cell)";
  }
  return (UI_[iv.type]||{n:"?"}).n;
}

"Japanese encephalitis":{d:"Virus isolated in Japan, 1935.",c:"Brain inflammation; often leaves permanent damage.",w:"Rural Asia including India; pigs and birds are the reservoir.",p:"JE vaccine; mosquito control.",r:"No cure — supportive care only."},
"Yellow fever":{d:"Shown to be mosquito-borne by Walter Reed, 1900.",c:"Fever, liver failure and jaundice (the 'yellow'), bleeding.",w:"Africa and South America.",p:"One highly effective, lifelong vaccine.",r:"Supportive care."},
"Zika":{d:"Identified 1947; caused a global emergency in 2015-16.",c:"Mild in adults — but causes severe brain defects in unborn babies.",w:"Tropics.",p:"Mosquito control; protect pregnancies.",r:"No specific treatment."},
"West Nile fever":{d:"Isolated in Uganda, 1937.",c:"Usually mild; occasionally causes brain inflammation.",w:"Africa, Europe, Americas, Asia.",p:"Mosquito control.",r:"Supportive care."},
"Rabies":{d:"Vaccine by Louis Pasteur, 1885.",c:"Creeps up your NERVES to the brain, where antibodies cannot follow. Almost 100% fatal once symptoms begin.",w:"Worldwide; dogs are the main source in India.",p:"Vaccinate dogs. After a bite: wash it, and get the vaccine IMMEDIATELY.",r:"Post-exposure vaccine works BEFORE symptoms start. After that, nothing does."},
"HIV":{d:"Identified 1983 by Montagnier and Barré-Sinoussi (Nobel Prize).",c:"It destroys HELPER T-CELLS — the commanders of your immune system. Without them, ordinary germs become lethal.",w:"Worldwide; ~39 million people live with HIV. Spread by unprotected sex, shared needles, and infected blood.",p:"Condoms; never share needles; screened blood; PrEP medication. It is NOT spread by mosquitoes, sharing food, or touching — a myth worth killing.",r:"Antiretroviral therapy: not a cure, but people now live full lives, and treatment makes them unable to pass it on. Attacking the immune system itself is why HIV is so dangerous."},
"Hepatitis B":{d:"Discovered by Baruch Blumberg, 1965 (Nobel Prize). First anti-cancer vaccine.",c:"Attacks the liver; can persist for life and cause liver cancer.",w:"Worldwide; ~250 million chronic carriers.",p:"Hepatitis B vaccine — given at birth in India.",r:"Antivirals control it; the vaccine prevents it."},
"Hepatitis C":{d:"Identified 1989; Nobel Prize 2020.",c:"Silently scars the liver for decades — cirrhosis and cancer.",w:"Worldwide.",p:"No vaccine yet; screened blood and clean needles.",r:"CURABLE since 2014 with direct-acting antivirals — one of medicine's great wins."},
"Chagas disease":{d:"Discovered by Carlos Chagas, 1909 — he found the parasite, the vector and the disease.",c:"A parasite that HIDES INSIDE HEART MUSCLE for decades, then destroys it.",w:"Latin America.",p:"Control the 'kissing bug'; improve housing.",r:"Drugs work early; once the heart is damaged, it is irreversible."},
"Lyme disease":{d:"Identified in Lyme, Connecticut, 1975.",c:"Bull's-eye rash; can attack the heart (Lyme carditis) and nerves.",w:"North America, Europe, parts of Asia — from tick bites.",p:"Cover skin in woods; remove ticks quickly.",r:"Antibiotics — very effective if caught early."},
"Plague":{d:"Yersinia pestis — the Black Death killed a third of Europe (1347-51).",c:"Swollen lymph nodes ('buboes'); the lung form spreads person to person and kills fast.",w:"Rare now; pockets in Africa, Asia, the Americas.",p:"Rodent and flea control.",r:"Curable with prompt antibiotics."},
"Scrub typhus":{d:"Recognised in Asia; a major cause of fever in India.",c:"Fever with a black scab at the mite bite; can cause pneumonia and brain inflammation.",w:"The 'tsutsugamushi triangle' — including India.",p:"Avoid mite-infested scrub; protective clothing.",r:"Doxycycline — cheap and highly effective."},
"Malaria":{d:"Ronald Ross proved mosquitoes carry it — in Secunderabad, INDIA, 1897. Nobel Prize.",c:"Bite → LIVER (hides inside liver cells) → bursts into blood → fever cycles, anaemia, cerebral malaria.",w:"Tropics; still a major disease in India.",p:"Nets, repellents, draining standing water.",r:"Antimalarials. P. vivax needs a SECOND drug to clear the liver — or it relapses months later."},
"Malaria (blood)":{d:"The blood stage — merozoites bursting out of the liver.",c:"Invades red blood cells; causes the classic fever cycles.",w:"Tropics.",p:"Mosquito control.",r:"NOW antibodies and phagocytes can reach it. This is the stage you can actually fight."},
"Kala-azar":{d:"Visceral leishmaniasis. Sir Upendranath Brahmachari developed the first cure — in India, 1920.",c:"HIDES INSIDE YOUR MACROPHAGES — it turns your own defender cell into its home. Destroys the spleen; fatal untreated.",w:"Bihar, India, has historically carried a large share of the world's cases.",p:"Sandfly control; indoor spraying.",r:"Liposomal amphotericin B. India has driven cases down dramatically."},
"Sleeping sickness":{d:"African trypanosomiasis; the parasite was found in 1901.",c:"ANTIGENIC VARIATION — it keeps changing its coat, so your antibodies never quite fit. Eventually invades the brain.",w:"Sub-Saharan Africa; spread by the tsetse fly.",p:"Vector control.",r:"Drugs exist, and cases have collapsed. Its trick — changing disguise — is why a vaccine is so hard."},
"Filariasis":{d:"Elephantiasis; the worm was found by Patrick Manson, 1877.",c:"Adult worms BLOCK YOUR LYMPHATIC VESSELS — fluid cannot drain, and limbs swell enormously.",w:"Tropics; India has run one of the world's largest elimination programmes.",p:"Mass drug administration; mosquito control.",r:"Antiparasitic drugs kill the worms; the swelling is often permanent."},
"Snake venom":{d:"Antivenom invented by Albert Calmette, 1895 — using antibodies from horses.",c:"Not alive, not a germ — a mix of toxic proteins. Attacks heart, kidneys and nerves.",w:"India has the world's highest snakebite death toll — roughly 58,000 a year.",p:"Boots and a torch after dark; never reach blindly into grass.",r:"ANTIVENOM — borrowed antibodies. PASSIVE immunity: instant, but temporary."},
"Russell's viper venom":{d:"One of India's 'Big Four' snakes.",c:"Destroys blood clotting and shreds the KIDNEYS — a leading cause of snakebite death in India.",w:"Across the Indian subcontinent.",p:"Boots; clear rubble near homes; torch at night.",r:"Antivenom, urgently. Dialysis may be needed for the kidneys."},
"Red scorpion sting":{d:"Indian red scorpion — among the most lethal scorpions in the world.",c:"Venom floods the body with adrenaline; the HEART and LUNGS fail.",w:"Western and southern India; a major cause of child deaths in some districts.",p:"Shake out shoes; seal home floors.",r:"The drug prazosin transformed survival — an Indian medical breakthrough."},
"Tetanus":{d:"Toxin isolated 1890 by Kitasato and von Behring.",c:"Its TOXIN locks the muscles rigid — 'lockjaw'. Not contagious at all.",w:"Soil and rusty metal, worldwide.",p:"Tetanus vaccine and boosters; clean wounds.",r:"Antitoxin and intensive care. Only antibodies can neutralise a toxin."},
"MRSA":{d:"Methicillin-resistant Staph aureus, first seen 1961.",c:"Skin abscesses — and in the blood it can seed ANY organ, including heart valves.",w:"Worldwide, especially hospitals.",p:"Hand hygiene; careful antibiotic use.",r:"Only a few antibiotics still work. The classic superbug."},
"Cellulitis":{d:"Caused by Streptococcus or Staphylococcus.",c:"Hot, red, spreading skin infection; can reach blood, bone and heart valves.",w:"Worldwide.",p:"Clean and cover cuts.",r:"Antibiotics."},
"Leptospirosis":{d:"Bacterium identified 1907.",c:"Fever, then kidney and liver failure (Weil's disease).",w:"Tropics; a monsoon and flood disease in India.",p:"Avoid wading in floodwater with open cuts; rodent control.",r:"Antibiotics, early."},
"Gas gangrene":{d:"Clostridium perfringens — notorious in the trenches of WWI.",c:"Destroys tissue fast, producing gas; its toxins poison the kidneys.",w:"Worldwide, in deep dirty wounds.",p:"Clean deep wounds promptly.",r:"Surgery plus antibiotics — a true emergency."},
"Syphilis":{d:"Bacterium found 1905; the first 'magic bullet' drug (Salvarsan) targeted it.",c:"Progresses over years to attack the brain and heart. Can pass to an unborn baby.",w:"Worldwide; rising again.",p:"Safe practices; screening in pregnancy.",r:"Penicillin — still completely effective after 80 years."},
"Brucellosis":{d:"Traced to goat's milk by David Bruce, 1887.",c:"Undulating fever; settles in the spleen, liver and bones.",w:"Worldwide, from unpasteurised milk and infected livestock.",p:"Pasteurise milk; vaccinate animals.",r:"Long courses of antibiotics."},
"Cold sore":{d:"Herpes simplex virus; known since antiquity.",c:"Blisters on the lip — then retreats into your NERVES to hide from antibodies.",w:"Worldwide; most adults carry it.",p:"Avoid contact during an outbreak.",r:"Antivirals shorten attacks. It is never fully cleared."},
"Human papillomavirus":{d:"Link to cervical cancer proven by Harald zur Hausen (Nobel Prize, 2008).",c:"Hides inside cells for years and can turn them cancerous. It causes almost ALL cervical cancer.",w:"Worldwide; most adults meet it at some point.",p:"The HPV VACCINE — the first vaccine that prevents a cancer. India began rolling it out nationally; it works best given before exposure.",r:"No antiviral. Screening catches early changes. This is the clearest case in the whole deck of a vaccine stopping a cancer before it starts."},
"Ebola":{d:"First outbreak near the Ebola River, 1976.",c:"Massive internal bleeding; liver and spleen collapse. Kills up to 90%.",w:"Central and West Africa.",p:"Isolation, protective equipment — and now a working vaccine.",r:"Antibody treatments and supportive care; survival has improved greatly."},
"Anthrax":{d:"Robert Koch used it in 1876 to PROVE germs cause disease. Pasteur vaccinated sheep in 1881.",c:"Its TOXIN kills cells directly; the inhaled form is nearly always fatal.",w:"Soil worldwide; affects livestock handlers.",p:"Vaccinate livestock; handle hides carefully.",r:"Antibiotics plus ANTITOXIN — the toxin must be neutralised separately."},
"Hookworm":{d:"Linked to anaemia by Arthur Looss, 1898 — he infected himself by accident.",c:"Burrows in through BARE SKIN, travels to the gut, and drinks your blood — causing anaemia.",w:"Warm damp soil where people walk barefoot.",p:"Wear shoes; sanitation.",r:"Deworming tablets plus iron."},
"Schistosomiasis":{d:"Worm found by Theodor Bilharz, 1851.",c:"Larvae penetrate skin in fresh water; adult worms scar the liver and bladder.",w:"Africa, Middle East, parts of Asia.",p:"Avoid infested fresh water; snail control.",r:"Praziquantel — a single effective drug."},
"Guinea worm":{d:"Ancient — possibly the 'fiery serpent' of the Bible.",c:"A metre-long worm slowly emerges through the skin.",w:"ALMOST ERADICATED — from 3.5 million cases in 1986 to a handful today.",p:"Filter drinking water. No drug, no vaccine — just clean water.",r:"Wind the worm out slowly. Proof that prevention alone can defeat a disease."},
"Histoplasmosis":{d:"Described 1906.",c:"A fungus from soil with bird or bat droppings; attacks the lungs and spleen.",w:"Worldwide, including river valleys of India.",p:"Avoid dusty caves and bird roosts.",r:"Antifungals; often self-limiting in healthy people."},
"Typhoid":{d:"Salmonella Typhi; 'Typhoid Mary' spread it while healthy herself.",c:"Prolonged high fever; infects the liver, spleen and gut.",w:"Where sanitation is poor — common in South Asia.",p:"Clean water; typhoid conjugate vaccine.",r:"Antibiotics — but drug-resistant typhoid is spreading in India and Pakistan."},
"Cholera":{d:"John Snow traced it to a London water pump in 1854 — the birth of epidemiology.",c:"Its TOXIN forces the gut to pour out litres of water. Dehydration kills within hours.",w:"Outbreaks wherever water is contaminated.",p:"Clean water and sanitation; oral vaccine.",r:"Oral rehydration salts (ORS) — simple, cheap, and one of the great lifesavers."},
"Dysentery":{d:"Shigella, identified by Kiyoshi Shiga, 1897.",c:"Bloody diarrhoea; can damage the kidneys.",w:"Where hygiene is poor.",p:"Handwashing, clean water.",r:"Rehydration; antibiotics when severe."},
"Food poisoning":{d:"E. coli described by Theodor Escherich, 1885.",c:"Cramps and diarrhoea; some strains harm the kidneys.",w:"Worldwide.",p:"Cook food properly; wash hands.",r:"Usually self-limiting; rehydration."},
"Listeria":{d:"Named after Joseph Lister, 1940.",c:"Survives refrigeration; crosses into the BRAIN and the placenta.",w:"Soft cheeses, deli meats; worldwide.",p:"Avoid unpasteurised dairy in pregnancy.",r:"Antibiotics."},
"Stomach ulcer (H. pylori)":{d:"Barry Marshall DRANK the bacteria in 1984 to prove they cause ulcers. He won the Nobel Prize.",c:"Burrows into the stomach lining; causes ulcers and stomach cancer.",w:"Perhaps half the world carries it.",p:"Hygiene and clean water.",r:"Antibiotics CURE it — ulcers were once thought to be caused by stress."},
"Rotavirus":{d:"Discovered 1973.",c:"Severe diarrhoea and dehydration in young children.",w:"Worldwide; a leading killer of children before vaccines.",p:"Rotavirus vaccine — now in India's immunisation programme.",r:"Oral rehydration."},
"Hepatitis A":{d:"Virus identified 1973.",c:"Liver inflammation and jaundice; no chronic form.",w:"Where sanitation is poor.",p:"Vaccine; clean food and water.",r:"Rest; recovery is usually complete."},
"Hepatitis E":{d:"Recognised after outbreaks in INDIA in the 1970s-80s.",c:"Liver inflammation; especially dangerous in pregnancy.",w:"Waterborne; common in South Asia.",p:"Clean water.",r:"Supportive care."},
"Norovirus":{d:"Traced to an outbreak in Norwalk, Ohio, 1968.",c:"Sudden violent vomiting and diarrhoea; astonishingly contagious.",w:"Worldwide — famous on cruise ships and in schools.",p:"Handwashing (alcohol gel works poorly here).",r:"Rehydration; passes in a couple of days."},
"Polio":{d:"Vaccines by Salk (1955) and Sabin (oral, 1961).",c:"Enters through the gut; destroys nerve cells and paralyses.",w:"Nearly eradicated — INDIA was declared polio-free in 2014.",p:"Oral polio vaccine — one of the great public-health triumphs.",r:"No cure for the paralysis. Prevention is everything."},
"Botulism":{d:"Toxin identified 1895. The most poisonous substance known to science.",c:"Not alive. Paralyses every muscle, including breathing. A few nanograms can kill.",w:"Improperly canned or preserved food.",p:"Proper canning; never feed honey to infants.",r:"ANTITOXIN. (In tiny doses this same toxin is Botox.)"},
"Shiga toxin (E. coli O157)":{d:"Named after Kiyoshi Shiga.",c:"Not alive. Destroys the KIDNEYS (haemolytic uraemic syndrome), especially in children.",w:"Undercooked beef, unpasteurised milk.",p:"Cook meat thoroughly.",r:"Supportive care and dialysis. Antibiotics can make it WORSE by releasing more toxin."},
"Roundworm":{d:"Ascaris lumbricoides — grows up to 35 cm long.",c:"Larvae migrate THROUGH THE LUNGS, then return to the gut. Can block the intestines.",w:"Where sanitation is poor — one of the commonest infections on Earth.",p:"Sanitation; deworming programmes.",r:"Deworming tablets. Too big for any cell to swallow."},
"Tapeworm":{d:"Neurocysticercosis recognised as a major cause of epilepsy.",c:"Larvae form cysts IN THE BRAIN — a leading cause of adult-onset epilepsy in India.",w:"Where pigs are raised with poor sanitation.",p:"Cook pork thoroughly; sanitation; handwashing.",r:"Antiparasitic drugs plus anti-seizure medicine."},
"Whipworm":{d:"Trichuris trichiura.",c:"Burrows into the gut wall; causes chronic blood loss and anaemia in children.",w:"Warm, humid regions worldwide.",p:"Sanitation; handwashing.",r:"Deworming tablets."},
"Amoebiasis":{d:"Entamoeba histolytica — the species name means 'tissue-dissolving'.",c:"Eats through the gut wall and forms a LIVER ABSCESS.",w:"Common in India and other tropical regions.",p:"Clean water; wash vegetables.",r:"Metronidazole; the abscess may need draining."},
"Giardia":{d:"Seen by Antonie van Leeuwenhoek in 1681 — in his own stool.",c:"Coats the gut and blocks absorption. You eat, but you starve — draining your energy.",w:"Worldwide; 'beaver fever' from streams and unclean water.",p:"Filter or boil water.",r:"Antiparasitic drugs."},
"Toxoplasmosis":{d:"Identified 1908.",c:"Forms silent CYSTS IN THE BRAIN and hides there for life. Dangerous to unborn babies and to people with AIDS.",w:"Worldwide — from undercooked meat and cat faeces.",p:"Cook meat; pregnant women should avoid cat litter.",r:"Drugs only when it reactivates."},
"Candida":{d:"A yeast that lives on almost everyone, harmlessly.",c:"Normally kept in check by your immune system and your other microbes — but if either falls, it invades ANY organ.",w:"Everywhere. It is already on you right now.",p:"Careful antibiotic use — killing your good bacteria lets Candida bloom.",r:"Antifungals. The classic OPPORTUNIST."},
"Scabies":{d:"The mite was seen under a microscope in 1687 — making scabies one of the FIRST diseases ever proven to have a specific cause.",c:"A mite that burrows into your skin and lays eggs. The unbearable itch is an ALLERGIC reaction to it — your own immune system causing the misery.",w:"Worldwide; ~200 million people at any moment. Spreads by prolonged skin-to-skin contact and shared bedding.",p:"Treat the whole household at once, and wash all bedding.",r:"Permethrin cream or ivermectin. Cheap and curable — but it keeps coming back if only one person is treated."},
"Ringworm":{d:"Not a worm at all — a FUNGUS. The name comes from the ring-shaped rash.",c:"A fungus digesting the keratin in your skin, hair and nails.",w:"Everywhere. Spreads by touch, shared towels, and from animals.",p:"Do not share towels or combs; keep skin dry.",r:"Antifungal cream. The commonest fungal infection on Earth — and one of the most misnamed."},
"Impetigo":{d:"Streptococcus or Staphylococcus on the skin.",c:"Golden crusted sores, mainly in children. Highly contagious by touch. Can lead to kidney damage.",w:"Worldwide; common where it is hot and crowded.",p:"Wash hands and cuts; do not share towels.",r:"Antibiotic cream or tablets."},
"Trachoma":{d:"Chlamydia trachomatis — the SAME species that causes the sexually transmitted infection, arriving by a completely different route.",c:"Repeated infection scars the eyelid until the lashes turn INWARD and scrape the eye. Blindness comes slowly, over years.",w:"The world's leading INFECTIOUS cause of blindness. India has fought a long campaign against it.",p:"Face-washing and clean water — the 'SAFE' strategy. Flies spread it between children's eyes.",r:"A single dose of azithromycin. Surgery for the eyelid. **A disease of poverty, cured by soap and water.**"},

"Molluscum contagiosum":{d:"A poxvirus — a distant cousin of smallpox.",c:"Small pearly bumps, spread by skin contact and shared towels. Harmless but stubborn.",w:"Worldwide; common in children.",p:"Do not share towels; cover the bumps.",r:"Usually clears on its own — but it can take a year. Your immune system gets there eventually."},
"Endocarditis":{d:"Infection of the heart valves — described by William Osler, 1885.",c:"Bacteria in the bloodstream settle on a HEART VALVE and build a colony there, where blood flow shields them from your immune cells.",w:"Worldwide. A risk after dental work, IV drug use, or a contaminated line — and after rheumatic fever has damaged a valve.",p:"Treat bloodstream infections early; look after damaged valves.",r:"Weeks of intravenous antibiotics; sometimes surgery to replace the valve."},
"Gonorrhoea":{d:"Bacterium found by Albert Neisser, 1879.",c:"Infects the reproductive tract; can spread to joints and heart valves. Often causes NO symptoms — so it spreads silently.",w:"Worldwide; about 82 million new cases a year.",p:"Condoms; testing and treating partners.",r:"Antibiotics — but it has now defeated almost every antibiotic we have. The WHO lists it as a PRIORITY superbug. This is antibiotic resistance happening in real time."},
"Chlamydia":{d:"Chlamydia trachomatis — the same species that causes trachoma, the leading infectious cause of blindness.",c:"An INTRACELLULAR bacterium — it lives inside your cells, where antibodies struggle to reach. Usually silent; can cause infertility.",w:"The commonest bacterial STI in the world.",p:"Condoms; routine screening.",r:"Antibiotics. Easy to cure — but only if you know you have it."},
"Genital herpes":{d:"Herpes simplex virus type 2.",c:"Like a cold sore, it retreats into your NERVES and hides there for life. Antibodies cannot follow it in.",w:"Worldwide; extremely common.",p:"Condoms reduce but do not eliminate the risk.",r:"Antivirals control outbreaks. It is never cleared — a lifelong passenger."},
"Trichomoniasis":{d:"A single-celled protozoan parasite, described 1836.",c:"The commonest curable STI on Earth. Often silent.",w:"Worldwide — around 156 million cases a year.",p:"Condoms; treating partners.",r:"A single course of metronidazole cures it."},
"Hepatitis D":{d:"Identified 1977 — the strangest virus in this deck.",c:"It is INCOMPLETE. It cannot infect you on its own: it can ONLY survive if Hepatitis B is already there, because it borrows Hep B's outer coat. A virus that parasitises another virus.",w:"Wherever Hepatitis B is; the most severe form of viral hepatitis.",p:"The Hepatitis B vaccine ALSO prevents Hepatitis D — block the host and the passenger cannot land.",r:"Hard to treat. Prevention through the Hep B vaccine is the real answer."},
"Transfusion malaria":{d:"Malaria delivered straight into the bloodstream by transfused blood.",c:"It SKIPS the mosquito and skips the tissues. It goes directly to the liver.",w:"Anywhere blood is not properly screened.",p:"Screening donated blood — which is why blood banks test every unit.",r:"Antimalarials. This is why safe transfusion is a public-health issue, not just a hospital one."},
"Catheter sepsis":{d:"A fungal bloodstream infection from a drip line or catheter.",c:"Candida travelling up a plastic tube straight into your blood, bypassing every barrier you have.",w:"Hospitals worldwide — one of the commonest hospital-acquired infections.",p:"Sterile technique; remove lines as soon as they are not needed.",r:"Antifungals. A reminder that medicine itself can open a door."},
"Cannula infection":{d:"Bacteria entering through a drip needle.",c:"Staph from the skin, pushed straight into the bloodstream by a needle. Can seed the heart valves.",w:"Hospitals worldwide.",p:"Clean the skin; change the line; wash hands.",r:"Antibiotics — and remove the line."},
"Tetanus toxin":{d:"Isolated 1890.",c:"Not alive. Locks the muscles rigid. It does not reproduce — it simply poisons.",w:"Released by tetanus bacteria in a wound.",p:"Tetanus vaccine trains you to make ANTITOXIN.",r:"Only antibodies can neutralise it. No cell can eat a toxin."},
"Cholera toxin":{d:"The reason cholera kills.",c:"Not alive. Forces gut cells to pump out water; the kidneys fail from dehydration.",w:"Released by cholera bacteria.",p:"Clean water.",r:"Rehydration; antibodies neutralise the toxin."},
"Clostridial toxin":{d:"The toxin of gas gangrene.",c:"Not alive. Destroys tissue and poisons the kidneys and liver.",w:"Deep dirty wounds.",p:"Clean wounds promptly.",r:"Antitoxin, surgery, antibiotics."},
"Diphtheria toxin":{d:"The toxin von Behring made the first antitoxin against.",c:"Not alive. Poisons the HEART muscle directly.",w:"Released by diphtheria bacteria.",p:"DPT vaccine.",r:"Antitoxin — antibodies, urgently."},
"Shingles":{d:"Recognised as reactivated chickenpox, 1953.",c:"The chickenpox virus hid in your nerves for decades and re-emerged.",w:"Anyone who has had chickenpox.",p:"Shingles vaccine.",r:"Antivirals. Proof that some viruses never truly leave."},
"Dengue (ADE)":{d:"Antibody-dependent enhancement, described in the 1970s.",c:"Your antibodies from a PREVIOUS dengue do not neutralise this serotype — they HELP it into your cells.",w:"Tropics.",p:"Mosquito control. This is exactly why a dengue vaccine is so hard to make.",r:"Antibodies will NOT work here. Use cells."},
"Malaria (relapse)":{d:"Hypnozoites described 1982.",c:"A dormant form of P. vivax slept in your liver and woke months later — from nothing.",w:"Wherever P. vivax occurs, including India.",p:"Finish the full course of primaquine to clear the liver.",r:"A second drug is needed specifically for the liver forms."},
"Tuberculosis (reactivated)":{d:"Latency has been known since the 19th century.",c:"TB you thought you had beaten was only sleeping. It woke when your defences fell.",w:"About a quarter of the world carries latent TB.",p:"Treat latent TB in high-risk people.",r:"Months of combination antibiotics."},
"Pneumococcal pneumonia":{d:"Streptococcus pneumoniae, 1881.",c:"Moves into lungs stripped bare by influenza. This — not the flu itself — killed most victims in 1918.",w:"Worldwide.",p:"Pneumococcal and flu vaccines.",r:"Antibiotics."},

function targetable(iv){ if(U.phase!=="command"||!sel.mode||busy) return false; const m=sel.mode;

// Lay a crowd out in concentric rings around the bloodstream hub so every token stays visible.
function fanOut(i){
  // invaders sit OUTSIDE the cells' inner ring, in widening circles — the bloodstream is a plaza
  const rings=[{n:9,r:52},{n:13,r:76},{n:17,r:100},{n:21,r:124}];
  let k=i;
  for(let r=0;r<rings.length;r++){
    if(k<rings[r].n){
      const a=(k/rings[r].n)*Math.PI*2 - Math.PI/2 + (r%2?Math.PI/rings[r].n:0);
      return {dx:Math.cos(a)*rings[r].r, dy:Math.sin(a)*rings[r].r};

    k-=rings[r].n;
  }
  const a=(k/21)*Math.PI*2; return {dx:Math.cos(a)*146, dy:Math.sin(a)*146};

// What each antigen-class code actually STANDS FOR, and who is in it.
/* How each pathogen TYPE is actually beaten — must match the engine exactly.
   NET: only living, non-worm, non-parasite targets (toxins/venom aren't alive; worms/parasites are too big).
   ENGULF: viruses, tagged bacteria, fungi, blood/sporozoite malaria, and a parasite chipped to its last HP.
   STRIKE: worms & parasites only, and only the Eosinophil (2) or Monocyte (1), after coating. */
const BEAT_BY_TYPE = {
  virus:    "Antibody neutralises it, or the Monocyte engulfs it. If it hides inside a cell, only the Killer T-Cell or NK Cell can reach it.",
  hidden:   "It is INSIDE one of your cells — antibodies cannot reach it there. Killer T-Cell (never misses) or NK Cell (d6 3+). Not all of these are viruses: Toxoplasmosis and Chagas disease are PROTOZOA that live inside your cells, which is why a Killer T-Cell is the answer for them too.",
  bacteria: "Coat it with a matching antibody, then engulf it — or trap the swarm in a Neutrophil NET. It divides if you ignore it!",
  fungus:   "It CANNOT be coated — antibodies do not opsonise fungi here. The Monocyte engulfs it directly (it has 2 HP, so that chips it), and a Neutrophil NET kills it outright. Fungi are an INNATE problem: neutrophils and macrophages do this work.",
  toxin:    "It is NOT alive — no cell can eat it, trap it or snipe it. ANTITOXIN antibodies are the only defence (2 AP to neutralise).",
  venom:    "It is NOT alive and acts far too fast for your B-cells. Only an ANTIVENOM dose works — you cannot make antibodies in time.",
  worm:     "Too big to swallow and immune to NETs. COAT it with an antibody, then the Eosinophil strikes (2 dmg) or degranulates (3 dmg, 2 AP, and it burns the organ).",
  parasite: "Coat it, then STRIKE it down with the Eosinophil (2 dmg) or Monocyte (1 dmg). Once it is on its last HP the Monocyte can finally engulf it. NETs do not hold it.",
  malaria:  "In the blood: antibodies or the Monocyte. Inside liver cells: only the Killer T-Cell or NK Cell can reach it.",
};

const FAM_LONG={
  ENV:{full:"ENVeloped virus",  eg:["Influenza","COVID-19","HIV","Dengue","Measles","Rabies","Hepatitis B"],
       why:"Wrapped in a stolen piece of your own cell membrane, studded with spike proteins. Antibodies grip the spikes."},
  NAK:{full:"NAKed virus",      eg:["Polio","Rotavirus","Norovirus","Hepatitis A","Common cold","HPV"],
       why:"No envelope — just a bare protein shell. Tough, survives on surfaces, and antibodies must grip the shell itself."},
  EXB:{full:"EXtracellular Bacterium", eg:["Cholera","Typhoid","MRSA","Tetanus","Plague","Pneumonia"],
       why:"Lives OUTSIDE your cells, often behind a slimy capsule. Antibodies coat it so phagocytes can grip it."},
  ICB:{full:"IntraCellular Bacterium", eg:["Tuberculosis","Leprosy","Listeria","Scrub typhus"],
       why:"Hides INSIDE your cells, where antibodies struggle to follow. This is why TB is so hard to kill."},
  TOX:{full:"TOXin (antitoxin)", eg:["Diphtheria","Botulism","Tetanus toxin","Anthrax","Shiga toxin"],
       why:"Not alive at all — no cell can eat it, trap it or snipe it. Your ANTITOXIN antibodies are the only defence (2 AP to neutralise). <b>Venom is NOT covered:</b> it acts far faster than your B-cells can respond, so a snakebite or a sting needs a ready-made ANTIVENOM dose instead."},
  EUK:{full:"EUKaryotic parasite", eg:["Malaria","Roundworm","Candida","Kala-azar","Tapeworm"],
       why:"Fungi, worms and protozoa — complex cells like ours, so they are hard to target without harming yourself."},

function famTip(f){

}


// ---- keep hover tooltips inside the visible screen (fixes edge cut-off) ----
function clampTip(tip){
  if(!tip) return;
  const host=tip.parentElement; if(!host) return;
  // Render the tooltip in FIXED coordinates so it escapes the scrollable side panel
  // (which would otherwise clip it) and never runs off the screen edges.
  requestAnimationFrame(()=>{
    const hr=host.getBoundingClientRect();
    const w=tip.offsetWidth||250, h=tip.offsetHeight||120, margin=10;
    let left = hr.left + hr.width/2 - w/2;
    left = Math.max(margin, Math.min(left, window.innerWidth - w - margin));
    let top = hr.top - h - 10;                       // prefer above the cell
    let below = false;
    if(top < margin){ top = hr.bottom + 10; below = true; }   // flip below if no room above
    const arrow = Math.max(14, Math.min(w-14, hr.left + hr.width/2 - left));
    tip.classList.add("fixedtip");
    tip.classList.toggle("below", below);
    tip.style.left = left + "px";
    tip.style.top  = top + "px";
    tip.style.setProperty("--arrow", arrow + "px");
  });
}
function unclampTip(tip){ if(tip){ tip.classList.remove("fixedtip","below"); tip.style.left=""; tip.style.top=""; } }
document.addEventListener("mouseover", e=>{
  const host = e.target.closest(".abcell,.famchip,[data-tip]");
  if(!host) return;
  const tip = host.querySelector(":scope > .tip");
  if(tip) clampTip(tip);
});
document.addEventListener("mouseout", e=>{
  const host = e.target.closest(".abcell,.famchip,[data-tip]");
  if(!host) return;
  const tip = host.querySelector(":scope > .tip");
  if(tip) unclampTip(tip);
});

// ---- distinct antigen-class ICONS (shape carries the biology) ----
function famIcon(f, col, sz){
  sz=sz||20; const c=col||"#888"; const h=sz/2;
  const S=(inner)=>`<svg class="famIcon" viewBox="0 0 24 24" width="${sz}" height="${sz}" aria-hidden="true">${inner}</svg>`;
  switch(f){
    // ENV — enveloped virus: a membrane sphere studded with spike proteins
    case "ENV": { var spikes="";
      [0,45,90,135,180,225,270,315].forEach(function(a){ var r=a*Math.PI/180,
        x1=(12+Math.cos(r)*6.2).toFixed(1), y1=(12+Math.sin(r)*6.2).toFixed(1),
        x2=(12+Math.cos(r)*9.4).toFixed(1), y2=(12+Math.sin(r)*9.4).toFixed(1);
        spikes+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="1.5"/><circle cx="'+x2+'" cy="'+y2+'" r="1.5" fill="'+c+'"/>'; });
      return S('<circle cx="12" cy="12" r="6.2" fill="'+c+'" opacity=".28"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="'+c+'" stroke-width="1.6"/>'+spikes); }
    // NAK — naked virus: a bare geometric capsid (icosahedron look), no spikes
    case "NAK": return S(`<polygon points="12,3 20,8 20,16 12,21 4,16 4,8" fill="${c}" opacity=".26"/><polygon points="12,3 20,8 20,16 12,21 4,16 4,8" fill="none" stroke="${c}" stroke-width="1.5"/><line x1="12" y1="3" x2="12" y2="21" stroke="${c}" stroke-width="1" opacity=".6"/><line x1="4" y1="8" x2="20" y2="16" stroke="${c}" stroke-width="1" opacity=".6"/><line x1="20" y1="8" x2="4" y2="16" stroke="${c}" stroke-width="1" opacity=".6"/>`);
    // EXB — extracellular bacterium: a rod (bacillus) with a capsule outline
    case "EXB": return S(`<rect x="4" y="8.5" width="16" height="7" rx="3.5" fill="${c}" opacity=".28"/><rect x="4" y="8.5" width="16" height="7" rx="3.5" fill="none" stroke="${c}" stroke-width="1.6"/><rect x="2.4" y="7" width="19.2" height="10" rx="5" fill="none" stroke="${c}" stroke-width="1" stroke-dasharray="2 2" opacity=".7"/>`);
    // ICB — intracellular bacterium: a rod INSIDE a host cell (bacterium within a circle)
    case "ICB": return S(`<circle cx="12" cy="12" r="9" fill="none" stroke="${c}" stroke-width="1.3" stroke-dasharray="3 2" opacity=".65"/><circle cx="12" cy="12" r="9" fill="${c}" opacity=".08"/><rect x="7.5" y="10" width="9" height="4" rx="2" fill="${c}" opacity=".85"/>`);
    // TOX — toxin: not alive. A hazard diamond.
    case "TOX": return S(`<polygon points="12,2.5 21.5,12 12,21.5 2.5,12" fill="${c}" opacity=".26"/><polygon points="12,2.5 21.5,12 12,21.5 2.5,12" fill="none" stroke="${c}" stroke-width="1.6"/><line x1="12" y1="7" x2="12" y2="13.5" stroke="${c}" stroke-width="1.9"/><circle cx="12" cy="16.6" r="1.2" fill="${c}"/>`);
    // EUK — eukaryotic parasite: an amoeboid blob with a nucleus
    case "EUK": return S(`<path d="M12 3.5 C16 3.5 20 6 20 11 C20 15 17.5 17 18 19 C15 21 13 19.5 11 20 C7 21 4 17 4.2 12.5 C4.4 7 8 3.5 12 3.5 Z" fill="${c}" opacity=".26"/><path d="M12 3.5 C16 3.5 20 6 20 11 C20 15 17.5 17 18 19 C15 21 13 19.5 11 20 C7 21 4 17 4.2 12.5 C4.4 7 8 3.5 12 3.5 Z" fill="none" stroke="${c}" stroke-width="1.5"/><circle cx="11" cy="12" r="2.6" fill="${c}" opacity=".7"/>`);
    // X — unknown
    default: return S(`<circle cx="12" cy="12" r="8.5" fill="${c}" opacity=".2"/><circle cx="12" cy="12" r="8.5" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="3 3"/><text x="12" y="16.5" text-anchor="middle" font-size="12" font-weight="900" fill="${c}">?</text>`);
  }
}

function abPanel(){
  if(!U.ab) return "";
  const keys=FAM_KEYS.concat(U.novelSeen?["X"]:[]);
  // which classes are actually threatening us right now?
  const threat={}; U.invaders.forEach(iv=>{ const f=famOf(iv); threat[f]=(threat[f]||0)+1; });
  return keys.map(f=>{
    const F = f==="X" ? {name:"UNKNOWN antigen",short:"?",col:"#fbbf24",bio:"A pathogen nobody has ever seen. No antibody you own fits it."} : FAMILIES[f];
    const have=U.ab[f]||0, cap=capFam(U,f);
    const pb=productionBreakdown(U,f); const rate=pb.net, mature=(U.made[f]||0)>=4;
    const locked = f==="X" && !U.cloneFound;
    const hot=threat[f]>0;
    const picking = sel.mode==="produce" && sel.kind==="cell" && sel.key==="bcell";
    const pips=Array.from({length:cap}).map((_,i)=>`<i class="${i<have?'on':''}"></i>`).join("");
    const L=FAM_LONG[f]||{full:F.name};
    const cue = pb.boosted?'<span class="rup" title="Boosted above base">▲</span>':(pb.reduced?'<span class="rdn" title="Reduced below base">▼</span>':'');
    const rateCls = pb.boosted?'boosted':(pb.reduced?'reduced':'');
    return `<div class="abcell ${hot?'hot':''} ${locked?'locked':''} ${picking&&!locked?'pick':''}"
        style="border-color:${hot?F.col:'var(--line)'}"
        ${picking&&!locked?`onclick="act({action:'produce',cell:'bcell',family:'${f}'})"`:''}>
      <div class="abtop"><span class="abtag" style="color:${F.col};border-color:${F.col}">${famIcon(f,F.col,15)}${f}</span>
        ${hot?`<span class="abthreat" style="color:${F.col}">${threat[f]}</span>`:''}
        ${mature?`<span class="abmat" title="Affinity maturation">★</span>`:''}
      </div>
      <div class="abname">${L.full.replace(/([A-Z]{2,})/g,'<b>$1</b>')}</div>
      <div class="abpips">${pips}</div>
      <div class="abrate ${rateCls}">${locked?'<b>LOCKED</b>':'+'+rate+'/action '+cue}</div>
      <div class="tip">${prodBreakdownHTML(pb)}${famTip(f)}</div>
    </div>`;
  }).join("");
}
/* the production math, revealed on hover/tap: base + each active effect -> net */
function prodBreakdownHTML(pb){
  const rows=[`<div class="pbRow"><span>Base output</span><span>+${pb.base}</span></div>`];
  pb.effects.forEach(e=>{
    const cls = e.kind==="boost"?"pbUp":"pbDn";
    if(e.delta===0){ rows.push(`<div class="pbNote">${e.label}</div>`); return; }
    rows.push(`<div class="pbRow ${cls}"><span>${e.label}</span><span>${e.delta>0?'+':''}${e.delta}</span></div>`);
  });
  if(pb.blocked) rows.push(`<div class="pbRow pbDn"><span>${pb.blocked}</span><span>→ 0</span></div>`);
  rows.push(`<div class="pbRow pbNet"><span>Made per action</span><span>+${pb.net}</span></div>`);
  let store=`<div class="pbRow pbStore"><span>Stockpile</span><span>${pb.storage.have}/${pb.storage.cap}</span></div>`;
  if(pb.storage.capReasons.length) store+=`<div class="pbNote">Storage capped (${pb.storage.capReasons.join(", ")})</div>`;
  return `<div class="pbHead">Production</div>${rows.join("")}${store}<div class="pbSep"></div>`;
}
