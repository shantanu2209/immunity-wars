          <div class="dzrow"><b>🌍 Found</b><span>${ue(info.w||"—")}</span></div>
          <div class="dzrow"><b>🛡️ Prevent</b><span>${ue(info.p||"—")}</span></div>
          <div class="dzrow"><b>💊 Treat</b><span>${ue(info.r||"—")}</span></div>
        </div>`;
      const fam = a.dz==="Pathogen X" ? "X" : (FAMILY[a.dz]||"?");
      const remembered = !!(U.memory && U.memory[a.dz]);
      return `<div class="thr ${back?'flipped':''}" style="border-color:${col};box-shadow:0 0 0 1.5px ${col},0 8px 24px -16px ${col}">
        <div class="hd" style="background:linear-gradient(180deg,${col}30,${col}10)">
          <div class="mt" style="--mtc:${col};color:${col}">${pathArt(a)?`<img class="mtimg" src="${pathArt(a)}" alt="${a.novel?"unknown pathogen":a.type}"/>`:`<div class="iv ${a.type}"><div class="bo">${UI_[a.type].g}</div></div>`}</div>
          <div style="flex:1"><div class="dz">${ue(a.dz)} ${a.n>1?`<span class="cnt2">x${a.n}</span>`:''}${remembered?' <span class="memtag">MEMORY</span>':''}${FAST_DISEASE[a.dz]?` <span class="fasttag" title="Emergency pathogen — moves ${FAST_DISEASE[a.dz]} steps per turn. Answer it immediately.">⚡ FAST ${FAST_DISEASE[a.dz]==3?"×3":"×2"}</span>`:''}</div>
            <div class="mb">${typeName(a)} · <span class="famchip" style="color:${fam==="X"?"#fbbf24":(FAMILIES[fam]?FAMILIES[fam].col:"#888")};border-color:${fam==="X"?"#fbbf24":(FAMILIES[fam]?FAMILIES[fam].col:"#888")}">${famIcon(fam,(fam==="X"?"#fbbf24":(FAMILIES[fam]?FAMILIES[fam].col:"#888")),13)}${fam}<div class="tip">${famTip(fam)}</div></span> · ${[...new Set(a.where)].join(", ")}</div></div>
          <button class="flipbtn" onclick="event.stopPropagation();flipped['${a.dz.replace(/'/g,"")}']=!flipped['${a.dz.replace(/'/g,"")}'];draw()" title="Flip the card">${back?'↩':'ⓘ'}</button></div>
        ${back?backHTML:front}</div>`;
    }).join("");
    const openHTML = cards ? `<div class="rack">${cards}</div>` : "";
    card+=`<div class="ca">
      <div class="stackHdr">
        <b>${list.length}</b> pathogen${list.length===1?"":"s"} in the body
        <span class="hnt" style="margin-left:auto">${openCard?"tap another to switch":"tap one to open its card"}</span>
      </div>
      <div class="stack">${chips}</div>
      ${openHTML}
      ${U._dice&&U._dice.length?`<div class="dice">${U._dice.map(x=>`<div class="di ${x.hit?'h':''}">${x.face}</div>`).join("")}</div>`:''}</div>`;
  }
  const ag=U.presentations, rate=rateFor(U);
  const log=`<div class="lgb">${U.log.map(l=>`<div class="ln ${l.kind}"><span class="tt">T${l.t}</span>${l.msg}</div>`).join("")}</div>`;
  const remembered = (U.invaders||[]).filter(iv=>iv.remembered && attackable(iv));
  const memBtn = remembered.length ? `<div class="avorder" style="border-color:var(--good)">
        <span class="hnt" style="flex:1">⚡ <b style="color:var(--good)">Memory response ready</b> — ${remembered.length} known pathogen${remembered.length>1?"s":""} your body has beaten before. ${U.difficulty==="hard"?"Destroy each for just 1 AP.":"Destroy each for free."}</span>
        <button class="bt sm ${sel.mode==='memory'?'pri':''}" ${(U.phase!=="command"||busy||(U.difficulty==="hard"&&U.ap<1))?'disabled':''} onclick="setMode('memory')">Memory kill</button>
      </div>` : "";
  const abBlock=`<div class="glass" style="padding:10px">
      <div class="lbl">Antibodies — one pool per antigen class ${sel.mode==="produce"?'<b style="color:var(--antibody)">· pick a class to make</b>':''}</div>
      ${memBtn}
      <div class="abgrid">${abPanel()}</div>
      <div class="meters">
        <div class="meter ag" title="Dendritic cells show captured germs to the adaptive system. The more antigen presented, the faster the B-Cell makes antibodies.">🔬 <span class="mono">${ag}</span> antigens</div>
        <div class="meter av" title="Antivenom: antibodies raised in HORSES and injected into you. Instant, borrowed, temporary — passive immunity. Your body cannot make it.">💉 <span class="mono">${U.antivenom}</span> antivenom · 3 AP to give</div>
      </div>
      <div class="avorder">
        <span class="hnt" style="flex:1">Order another vial — antivenom must be <b>brought to you</b>. ${(U.avOrder||0)>0?`<b style="color:var(--good)">${U.avOrder}/${ANTIVENOM_ORDER} AP</b>`:`${ANTIVENOM_ORDER} AP for +1`}</span>
        <button class="bt sm" ${(U.phase!=="command"||U.ap<1||busy)?'disabled':''} onclick="act({action:'orderAntivenom',ap:1})">+1 AP</button>
        <button class="bt sm" ${(U.phase!=="command"||U.ap<2||busy)?'disabled':''} onclick="act({action:'orderAntivenom',ap:2})">+2</button>
      </div></div>`;
  const cellBlock=`<div class="glass" style="padding:10px">
      <div class="lbl" style="margin-bottom:6px">Your cells · ${cells.split('class="cc').length-1} defenders</div>
      <div class="cp">${cells}</div>
      <div class="ctlsep"><span>Organ stations · ${U.organList.length}${U.organList.length>=7?" (all organs — hard mode)":""} · each with its own resident macrophage</span></div>
      <div class="cp cp-org">${organCards}</div>
    </div>`;
  document.getElementById("side").innerHTML = card + cellBlock + abBlock + resPanel + vaccinePanel() + log;
}
function modal(){ const r=document.getElementById("modalRoot"); if(!r) return;
  if(U.won) r.innerHTML=`<div class="ovl"><div class="mdl w"><h2>The body is clear.</h2><p>You faced every infection of the outbreak and then cleared the body of the very last pathogen. <b>That is what beating a disease actually means</b> — not outlasting a clock, but destroying the invaders and letting the body recover.</p>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:center"><button class="bt pri" onclick="newG()">New game</button><button class="bt" onclick="document.getElementById('modalRoot').innerHTML=''">Review</button></div></div></div>`;
  else if(U.lost){ const o=U.lost.organ;
    if(!o){ // attrition / backstop loss
      r.innerHTML=`<div class="ovl"><div class="mdl l"><h2>The infection wore you down.</h2>
        <p>The outbreak stopped bringing new invaders after turn ${U.maxTurn}, but you could not clear the ones already inside in time. After turn ${U.maxTurn+15} the immune system is exhausted — a chronic infection the body never shook off. <b>Winning means clearing every last pathogen.</b></p>
        <div style="margin-top:14px;display:flex;gap:8px;justify-content:center"><button class="bt pri" onclick="newG()">Try again</button><button class="bt" onclick="document.getElementById('modalRoot').innerHTML=''">Review</button></div></div></div>`;
    } else {
      r.innerHTML=`<div class="ovl"><div class="mdl l"><h2>${ORGANS[o].name} failure.</h2>
        <p>The <b>${ORGANS[o].name}</b> was infected once too often and gave out on turn ${U.lost.turn}. Organ failure means the body falls — even if every other organ was fine.</p>
        <p style="margin-top:8px;font-size:11.5px;font-style:italic;color:var(--faint)">${ORGANS[o].bio}</p>
        <div style="margin-top:14px;display:flex;gap:8px;justify-content:center"><button class="bt pri" onclick="newG()">Try again</button><button class="bt" onclick="document.getElementById('modalRoot').innerHTML=''">Review</button></div></div></div>`; }
  }
  else r.innerHTML=""; }
newG();
</script>
